name: README rendering test figure

on:
  push:
    branches:
      - main
    paths:
      - CMakeLists.txt
      - .github/workflows/publish-readme-rendering-test.yml
      - shared/assets/src/tikz/**
      - README-Rendering-Test/assets/src/tikz/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install figure toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern fonts-lmodern poppler-utils scour

      - name: Generate rendering test figure
        run: |
          cmake -S . -B cmake-build-figures
          cmake --build cmake-build-figures --target tikz_README_Rendering_Test_github_readme_width_test --parallel 8

      - name: Verify fixed canvas
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def viewbox_width(path):
              text = Path(path).read_text(encoding="utf-8")
              root = text.split(">", 1)[0]
              match = re.search(r'\bviewBox="([^\"]+)"', root)
              if not match:
                  raise SystemExit(f"cannot read viewBox from {path}: {root}")
              values = [float(v) for v in match.group(1).split()]
              if len(values) != 4:
                  raise SystemExit(f"invalid viewBox in {path}: {match.group(1)}")
              return values[2], root + ">"

          test_width, test_root = viewbox_width(
              "README-Rendering-Test/assets/github-readme-width-test.svg"
          )
          ref_width, ref_root = viewbox_width(
              "SNode.C/assets/programming-model.svg"
          )
          print("test:", test_root)
          print("reference:", ref_root)
          if abs(test_width - ref_width) > 0.001:
              raise SystemExit(
                  f"viewBox width mismatch: test={test_width}, reference={ref_width}"
              )
          if abs(test_width - 454.0) > 0.001:
              raise SystemExit(f"unexpected canonical desktop viewBox width: {test_width}")
          print(f"canvas matches canonical desktop SVG: viewBox width {test_width}")
          PY

      - name: Prepare root README rendering probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          heading = "## GitHub figure-width rendering probe"
          if heading in text:
              raise SystemExit(0)

          marker = (
              "page, backed by qualified releases, a coherent visual identity, reproducible\n"
              "demos, trustworthy project infrastructure, and a responsible launch campaign.\n"
          )
          block = """

## GitHub figure-width rendering probe

The figure below is intentionally embedded with ordinary GitHub Markdown and no
HTML width override. Its generated SVG uses the canonical **160 mm desktop
canvas** so its apparent scale can be compared directly with figures in the
product READMEs.

![Canonical 160 mm GitHub scale test](README-Rendering-Test/assets/github-readme-width-test.svg)

*Rendering probe only: the process, state, application, and control boxes use the
shared canonical TikZ system, with 8 mm edge-to-edge connectors and 2 mm label
clearance.*
"""
          if marker not in text:
              raise SystemExit("README insertion marker not found")
          path.write_text(text.replace(marker, marker + block, 1), encoding="utf-8")
          PY

      - name: Publish generated SVG and README probe
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          source_inputs=(
            CMakeLists.txt
            .github/workflows/publish-readme-rendering-test.yml
            shared/assets/src/tikz
            README-Rendering-Test/assets/src/tikz
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f README-Rendering-Test/assets/github-readme-width-test.svg README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish canonical README rendering probe"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet "${GITHUB_SHA}"..origin/main -- "${source_inputs[@]}"; then
              echo "Newer rendering-test inputs exist on main; skip stale publication."
              exit 0
            fi
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved during publication; retrying (${attempt}/3)."
          done
          exit 1
