name: README rendering test figure

on:
  push:
    branches:
      - main
    paths:
      - CMakeLists.txt
      - .github/workflows/publish-readme-rendering-test.yml
      - shared/assets/src/tikz/**
      - README-Rendering-Test/assets/src/tikz/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install figure toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern fonts-lmodern poppler-utils scour

      - name: Generate rendering test figure
        run: |
          cmake -S . -B cmake-build-figures
          cmake --build cmake-build-figures --target tikz_README_Rendering_Test_github_readme_width_test --parallel 8

      - name: Verify fixed canvas
        run: |
          grep -q 'width="454pt"' README-Rendering-Test/assets/github-readme-width-test.svg
          grep -q 'viewBox="0 0 454 ' README-Rendering-Test/assets/github-readme-width-test.svg

      - name: Publish generated SVG
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f README-Rendering-Test/assets/github-readme-width-test.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate README rendering test figure"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
