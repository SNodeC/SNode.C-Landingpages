name: One-time MQTTSuite figure publication

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-mqtt-figures.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Run one-time MQTTSuite figure publication'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install figure toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-extra \
            texlive-fonts-recommended \
            lmodern \
            inkscape \
            scour

      - name: Generate figures
        run: |
          cmake -S . -B cmake-build-figures
          cmake --build cmake-build-figures --target figures --parallel 8

      - name: Preserve excluded figure 24
        run: |
          git restore --source=HEAD -- \
            MQTTSuite/assets/bridge-patch-sse-lifecycle.svg \
            MQTTSuite/assets/bridge-patch-sse-lifecycle-mobile.svg

      - name: Publish generated SVG assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MQTTSuite/assets/*.svg
          if git diff --cached --quiet; then
            echo 'No generated SVG changes to publish.'
            exit 0
          fi
          git commit -m 'Publish TikZ-generated MQTTSuite figures'
          git push origin HEAD:main
