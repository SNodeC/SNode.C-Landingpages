name: MQTTSuite figure validation and publication

on:
  push:
    branches:
      - main
    paths:
      - CMakeLists.txt
      - .github/workflows/publish-mqtt-figures.yml
      - MQTTSuite/assets/src/tikz/**
      - MQTTSuite/assets/src/first-success/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mqttsuite-figures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install figure toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-extra \
            texlive-fonts-recommended \
            lmodern \
            poppler-utils \
            inkscape \
            scour \
            python3-pil
          pdflatex --version | head -n 1
          pdftocairo -v 2>&1 | head -n 1
          inkscape --version
          scour --version
          python3 -c 'import PIL; print(PIL.__version__)'
          test -n "$(kpsewhich lmsans10-regular.otf)"
          test -n "$(kpsewhich lmsans10-bold.otf)"

      - name: Generate technical figures
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B cmake-build-figures
          cmake --build cmake-build-figures --target figures --parallel 8 2>&1 | tee figure-build.log

      - name: Generate first-success runtime evidence
        run: python3 MQTTSuite/assets/src/first-success/compose.py

      - name: Rasterize review renders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p figure-review/generated figure-review/runtime-publication figure-review/runtime-source
          for svg in MQTTSuite/assets/*.svg; do
            name="$(basename "${svg%.svg}")"
            if [[ "$name" == *-mobile ]]; then
              width=350
            else
              width=830
            fi
            inkscape "$svg" \
              --export-type=png \
              --export-width="$width" \
              --export-filename="figure-review/generated/${name}.png"
          done
          cp MQTTSuite/assets/*.png figure-review/runtime-publication/
          cp MQTTSuite/assets/src/first-success/*.png figure-review/runtime-source/
          cp figure-build.log figure-review/

      - name: Upload review renders
        uses: actions/upload-artifact@v4
        with:
          name: mqttsuite-figure-review-${{ github.sha }}
          path: figure-review/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run one-time MQTTSuite figure publication'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install figure toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-extra \
            texlive-fonts-recommended \
            lmodern \
            poppler-utils \
            scour \
            python3-pil

      - name: Generate canonical outputs
        run: |
          cmake -S . -B cmake-build-figures
          cmake --build cmake-build-figures --target figures --parallel 8
          python3 MQTTSuite/assets/src/first-success/compose.py

      - name: Publish complete reviewed output family
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MQTTSuite/assets/*.svg \
                  MQTTSuite/assets/first-success-terminal.png \
                  MQTTSuite/assets/first-success-terminal-mobile.png
          if git diff --cached --quiet; then
            echo 'No generated output changes to publish.'
            exit 0
          fi
          git commit -m 'Publish reviewed MQTTSuite figure family'
          git push origin HEAD:main
