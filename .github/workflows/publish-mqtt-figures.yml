name: MQTTSuite figure validation and publication

on:
  push:
    branches:
      - main
    paths:
      - CMakeLists.txt
      - .github/workflows/publish-mqtt-figures.yml
      - MQTTSuite/assets/src/tikz/**
      - MQTTSuite/assets/src/first-success/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mqttsuite-figures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install figure toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-extra \
            texlive-fonts-recommended \
            lmodern \
            fonts-lmodern \
            poppler-utils \
            inkscape \
            scour \
            python3-pil
          pdflatex --version | head -n 1
          pdftocairo -v 2>&1 | head -n 1
          inkscape --version
          scour --version
          python3 -c 'import PIL; print(PIL.__version__)'
          test -n "$(kpsewhich lmsans10-regular.otf)"
          test -n "$(kpsewhich lmsans10-bold.otf)"

      - name: Generate technical figures
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B cmake-build-figures
          cmake --build cmake-build-figures --target figures --parallel 8 2>&1 | tee figure-build.log

      - name: Generate first-success runtime evidence
        run: python3 MQTTSuite/assets/src/first-success/compose.py

      - name: Rasterize review renders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p figure-review/generated figure-review/runtime-publication figure-review/runtime-source
          for svg in MQTTSuite/assets/*.svg; do
            name="$(basename "${svg%.svg}")"
            if [[ "$name" == *-mobile ]]; then
              width=350
            else
              width=830
            fi
            inkscape "$svg" \
              --export-type=png \
              --export-width="$width" \
              --export-filename="figure-review/generated/${name}.png"
          done
          cp MQTTSuite/assets/*.png figure-review/runtime-publication/
          cp MQTTSuite/assets/src/first-success/*.png figure-review/runtime-source/
          cp figure-build.log figure-review/

      - name: Upload review renders
        uses: actions/upload-artifact@v4
        with:
          name: mqttsuite-figure-review-${{ github.sha }}
          path: figure-review/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'Run one-time MQTTSuite figure publication' ||
      startsWith(github.event.head_commit.message, 'Publish reviewed Figure ')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install figure toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-extra \
            texlive-fonts-recommended \
            lmodern \
            fonts-lmodern \
            poppler-utils \
            scour \
            python3-pil

      - name: Generate canonical outputs
        run: |
          cmake -S . -B cmake-build-figures
          cmake --build cmake-build-figures --target figures --parallel 8
          python3 MQTTSuite/assets/src/first-success/compose.py

      - name: Publish reviewed outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          add_svg_pair() {
            local stem="$1"
            git add "MQTTSuite/assets/${stem}.svg" "MQTTSuite/assets/${stem}-mobile.svg"
          }

          message="${{ github.event.head_commit.message }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
             [[ "$message" == "Run one-time MQTTSuite figure publication" ]]; then
            git add MQTTSuite/assets/*.svg \
                    MQTTSuite/assets/first-success-terminal.png \
                    MQTTSuite/assets/first-success-terminal-mobile.png
          else
            case "$message" in
              'Publish reviewed Figure 1')  add_svg_pair application-message-flow ;;
              'Publish reviewed Figure 2')
                git add MQTTSuite/assets/first-success-terminal.png \
                        MQTTSuite/assets/first-success-terminal-mobile.png ;;
              'Publish reviewed Figure 3')  add_svg_pair configuration-hierarchy-persistence ;;
              'Publish reviewed Figure 4')  add_svg_pair logical-bridge-forwarding ;;
              'Publish reviewed Figure 5')  add_svg_pair raw-envelope-projections ;;
              'Publish reviewed Figure 6')  add_svg_pair broker-listener-families ;;
              'Publish reviewed Figure 7')  add_svg_pair broker-http-surfaces ;;
              'Publish reviewed Figure 8')  add_svg_pair broker-embedded-mapper ;;
              'Publish reviewed Figure 9')  add_svg_pair integrator-mapping-pipeline ;;
              'Publish reviewed Figure 10') add_svg_pair integrator-topic-tree-matching ;;
              'Publish reviewed Figure 11') add_svg_pair integrator-mapping-modes ;;
              'Publish reviewed Figure 12') add_svg_pair bridge-runtime-clients ;;
              'Publish reviewed Figure 13') add_svg_pair bridge-definition-hierarchy ;;
              'Publish reviewed Figure 14') add_svg_pair bridge-prefix-construction ;;
              'Publish reviewed Figure 15') add_svg_pair loop-boundaries ;;
              'Publish reviewed Figure 16') add_svg_pair mqttcli-command-hierarchy ;;
              'Publish reviewed Figure 17') add_svg_pair json-topic-projection-extraction ;;
              'Publish reviewed Figure 18') add_svg_pair mqttsuite-configuration-hierarchy ;;
              'Publish reviewed Figure 19') add_svg_pair qos-subscribe-vs-publish ;;
              'Publish reviewed Figure 20') add_svg_pair broker-trust-boundary ;;
              'Publish reviewed Figure 21') add_svg_pair integrator-trust-boundary ;;
              'Publish reviewed Figure 22') add_svg_pair mapping-administration-lifecycle ;;
              'Publish reviewed Figure 23') add_svg_pair bridge-trust-boundary ;;
              'Publish reviewed Figure 24') add_svg_pair bridge-patch-sse-lifecycle ;;
              *)
                echo "Unknown per-figure publication gate: $message" >&2
                exit 1 ;;
            esac
          fi

          if git diff --cached --quiet; then
            echo 'Reviewed figure output already matches canonical source.'
            exit 0
          fi

          git commit -m 'Publish reviewed MQTTSuite figure output'
          git push origin HEAD:main
