name: MQTTSuite figure validation
# CI builds only figures admitted by the refinement gate, publishes their
# generated SVGs on main so README figures are immediately visible, and uploads
# review artifacts. Unrefined figures stay completely outside this CI run.

on:
  push:
    branches:
      - main
    paths:
      - CMakeLists.txt
      - .github/workflows/publish-mqtt-figures.yml
      - MQTTSuite/assets/src/tikz/**
      - MQTTSuite/assets/src/first-success/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mqttsuite-figures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install figure toolchain
        run: |
          # GitHub-hosted runners can carry Google apt sources that are unrelated
          # to figure generation. Disable those unused third-party sources so a
          # transient Chrome repository mismatch cannot make figure CI red.
          sudo rm -f /etc/apt/sources.list.d/*google*
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-extra \
            texlive-fonts-recommended \
            lmodern \
            fonts-lmodern \
            poppler-utils \
            inkscape \
            scour \
            python3-pil
          pdflatex --version | head -n 1
          pdftocairo -v 2>&1 | head -n 1
          inkscape --version
          scour --version
          python3 -c 'import PIL; print(PIL.__version__)'
          test -n "$(kpsewhich lmsans10-regular.otf)"
          test -n "$(kpsewhich lmsans10-bold.otf)"

      - name: Generate refined technical figures
        shell: bash
        run: |
          set -euo pipefail
          manifest="MQTTSuite/assets/src/tikz/ci-enabled-figures.txt"
          mapfile -t stems < <(grep -Ev '^[[:space:]]*(#|$)' "$manifest")

          if (( ${#stems[@]} == 0 )); then
            echo "No MQTTSuite figures are enabled by the refinement gate." >&2
            exit 1
          fi

          targets=()
          for stem in "${stems[@]}"; do
            source="MQTTSuite/assets/src/tikz/${stem}.tex"
            if [[ ! -f "$source" ]]; then
              echo "Refinement gate references missing source: $source" >&2
              exit 1
            fi
            target="tikz_MQTTSuite_${stem//-/_}"
            targets+=("$target")
            echo "CI-enabled figure: $stem -> $target"
          done

          cmake -S . -B cmake-build-figures
          cmake --build cmake-build-figures --target "${targets[@]}" --parallel 8 2>&1 | tee figure-build.log

      - name: Generate first-success runtime evidence
        run: python3 MQTTSuite/assets/src/first-success/compose.py

      - name: Rasterize review renders
        shell: bash
        run: |
          set -euo pipefail
          manifest="MQTTSuite/assets/src/tikz/ci-enabled-figures.txt"
          mapfile -t stems < <(grep -Ev '^[[:space:]]*(#|$)' "$manifest")

          mkdir -p figure-review/generated figure-review/generated-svg figure-review/runtime-publication figure-review/runtime-source
          for stem in "${stems[@]}"; do
            svg="MQTTSuite/assets/${stem}.svg"
            if [[ ! -f "$svg" ]]; then
              echo "Expected generated SVG is missing: $svg" >&2
              exit 1
            fi
            if [[ "$stem" == *-mobile ]]; then
              width=350
            else
              width=830
            fi
            inkscape "$svg" \
              --export-type=png \
              --export-width="$width" \
              --export-filename="figure-review/generated/${stem}.png"
            cp "$svg" figure-review/generated-svg/
          done

          cp MQTTSuite/assets/*.png figure-review/runtime-publication/
          cp MQTTSuite/assets/src/first-success/*.png figure-review/runtime-source/
          cp figure-build.log figure-review/

      - name: Publish generated MQTTSuite SVGs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          manifest="MQTTSuite/assets/src/tikz/ci-enabled-figures.txt"
          mapfile -t stems < <(grep -Ev '^[[:space:]]*(#|$)' "$manifest")

          files=()
          for stem in "${stems[@]}"; do
            file="MQTTSuite/assets/${stem}.svg"
            if [[ ! -f "$file" ]]; then
              echo "Expected generated SVG is missing: $file" >&2
              exit 1
            fi
            files+=("$file")
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- "${files[@]}"

          if git diff --cached --quiet; then
            echo "Generated refined MQTTSuite SVGs already match the committed publication outputs."
          else
            git commit -m "Regenerate refined MQTTSuite figures"
            git push origin HEAD:main
          fi

      - name: Upload review renders
        uses: actions/upload-artifact@v4
        with:
          name: mqttsuite-figure-review-${{ github.sha }}
          path: figure-review/
          if-no-files-found: error
          retention-days: 14
