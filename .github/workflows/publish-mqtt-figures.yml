name: MQTTSuite figure validation
# CI compiles the canonical TikZ sources, publishes their generated SVGs on
# main so README figures are immediately visible, and uploads review artifacts.

on:
  push:
    branches:
      - main
    paths:
      - CMakeLists.txt
      - .github/workflows/publish-mqtt-figures.yml
      - MQTTSuite/assets/src/tikz/**
      - MQTTSuite/assets/src/first-success/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mqttsuite-figures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install figure toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-extra \
            texlive-fonts-recommended \
            lmodern \
            fonts-lmodern \
            poppler-utils \
            inkscape \
            scour \
            python3-pil
          pdflatex --version | head -n 1
          pdftocairo -v 2>&1 | head -n 1
          inkscape --version
          scour --version
          python3 -c 'import PIL; print(PIL.__version__)'
          test -n "$(kpsewhich lmsans10-regular.otf)"
          test -n "$(kpsewhich lmsans10-bold.otf)"

      - name: Generate technical figures
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B cmake-build-figures
          cmake --build cmake-build-figures --target figures --parallel 8 2>&1 | tee figure-build.log

      - name: Generate first-success runtime evidence
        run: python3 MQTTSuite/assets/src/first-success/compose.py

      - name: Rasterize review renders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p figure-review/generated figure-review/generated-svg figure-review/runtime-publication figure-review/runtime-source
          for svg in MQTTSuite/assets/*.svg; do
            name="$(basename "${svg%.svg}")"
            if [[ "$name" == *-mobile ]]; then
              width=350
            else
              width=830
            fi
            inkscape "$svg" \
              --export-type=png \
              --export-width="$width" \
              --export-filename="figure-review/generated/${name}.png"
          done
          cp MQTTSuite/assets/*.svg figure-review/generated-svg/
          cp MQTTSuite/assets/*.png figure-review/runtime-publication/
          cp MQTTSuite/assets/src/first-success/*.png figure-review/runtime-source/
          cp figure-build.log figure-review/

      - name: Publish generated MQTTSuite SVGs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          files=()
          while IFS= read -r source; do
            stem="$(basename "${source%.tex}")"
            files+=("MQTTSuite/assets/${stem}.svg")
          done < <(
            find MQTTSuite/assets/src/tikz \
              -maxdepth 1 \
              -type f \
              -name '*.tex' \
              ! -name '*-figure-system.tex' \
              -print | sort
          )

          if (( ${#files[@]} == 0 )); then
            echo "No MQTTSuite TikZ figure sources found."
            exit 1
          fi

          for file in "${files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Expected generated SVG is missing: $file" >&2
              exit 1
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- "${files[@]}"

          if git diff --cached --quiet; then
            echo "Generated MQTTSuite SVGs already match the committed publication outputs."
          else
            git commit -m "Regenerate MQTTSuite figures"
            git push origin HEAD:main
          fi

      - name: Upload review renders
        uses: actions/upload-artifact@v4
        with:
          name: mqttsuite-figure-review-${{ github.sha }}
          path: figure-review/
          if-no-files-found: error
          retention-days: 14
