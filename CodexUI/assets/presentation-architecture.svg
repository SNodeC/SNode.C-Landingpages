<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 675">
  <title id="title">CodexUI native and browser presentation architecture</title>
  <desc id="desc">CodexUI native and browser presentation architecture</desc>
  <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111b2e"/>
      </linearGradient>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#e3b341" stop-opacity=".95"/>
        <stop offset="1" stop-color="#e3b341" stop-opacity=".35"/>
      </linearGradient>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
      </pattern>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0 0L10 5L0 10Z" fill="#e3b341"/>
      </marker>
      <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0 0L10 5L0 10Z" fill="#a9b8cd"/>
      </marker>
    </defs>
  <rect width="1200" height="675" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="675" rx="30" fill="url(#grid)"/>
  <path d="M0 667H1200" stroke="#e3b341" stroke-width="8" opacity=".9"/>

  <text x="55" y="48" fill="#e3b341" font-family="Inter,ui-sans-serif,system-ui" font-size="20" font-weight="700" letter-spacing="3">PRESENTATION ARCHITECTURE</text>
    <text x="55" y="110" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="48" font-weight="750">Two clients, one bridge contract</text>
    <text x="55" y="153" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="22">Native and browser paths converge without sharing an implementation runtime.</text>
  <rect x="55" y="190" width="480" height="390" rx="24" fill="#14223a" stroke="#58a6ff" stroke-width="2"/>
  <text x="85" y="230" fill="#58a6ff" font-family="Inter,ui-sans-serif,system-ui" font-size="17" font-weight="700">NATIVE PROCESS</text>
  <g>
      <rect x="85" y="265" width="190" height="120" rx="18" fill="#14223a" stroke="#e3b341" stroke-width="1.5"/>
      <text x="109" y="303" fill="#e3b341" font-family="ui-monospace,monospace" font-size="24" font-weight="700">QT</text>
      <text x="149" y="303" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">Qt GUI</text>
      <text x="109" y="337" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">widgets</text>
<text x="109" y="362" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">presentation state</text>
    </g>
  <g>
      <rect x="315" y="265" width="190" height="120" rx="18" fill="#14223a" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="339" y="303" fill="#58a6ff" font-family="ui-monospace,monospace" font-size="24" font-weight="700">C++</text>
      <text x="379" y="303" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">SNode.C thread</text>
      <text x="339" y="337" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">AISuite client</text>
<text x="339" y="362" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">selected transport</text>
    </g>
  <g><path d="M275 325L315 325" fill="none" stroke="#58a6ff" stroke-width="3"  marker-end="url(#arrow)"/>
      <text x="295" y="315" text-anchor="middle" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="14">bounded JSONL</text></g>
  <g>
      <rect x="85" y="430" width="420" height="100" rx="18" fill="#14223a" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="109" y="468" fill="#58a6ff" font-family="ui-monospace,monospace" font-size="24" font-weight="700">+</text>
      <text x="149" y="468" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">Native-only integrations</text>
      <text x="109" y="502" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">local Git · filesystem · desktop · non-WebSocket transports</text>
    </g>
  <rect x="595" y="190" width="250" height="390" rx="24" fill="#14223a" stroke="#e3b341" stroke-width="2"/>
  <text x="625" y="230" fill="#e3b341" font-family="Inter,ui-sans-serif,system-ui" font-size="17" font-weight="700">BROWSER</text>
  <g>
      <rect x="625" y="265" width="190" height="160" rx="18" fill="#14223a" stroke="#e3b341" stroke-width="3"/>
      <text x="649" y="303" fill="#e3b341" font-family="ui-monospace,monospace" font-size="24" font-weight="700">WEB</text>
      <text x="689" y="303" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">CodexWebUI</text>
      <text x="649" y="337" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">React presentation</text>
<text x="649" y="362" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">TypeScript SDK</text>
<text x="649" y="387" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">WebSocket / WSS</text>
    </g>
  <g>
      <rect x="625" y="460" width="190" height="70" rx="18" fill="#14223a" stroke="#56d364" stroke-width="1.5"/>
      <text x="649" y="498" fill="#56d364" font-family="ui-monospace,monospace" font-size="24" font-weight="700">✓</text>
      <text x="689" y="498" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">No Node runtime</text>
      <text x="649" y="532" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">static artifact</text>
    </g>
  <g>
      <rect x="925" y="250" width="220" height="130" rx="18" fill="#14223a" stroke="#bc8cff" stroke-width="3"/>
      <text x="949" y="288" fill="#bc8cff" font-family="ui-monospace,monospace" font-size="24" font-weight="700">BR</text>
      <text x="989" y="288" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">codex-bridge</text>
      <text x="949" y="322" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">routing</text>
<text x="949" y="347" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">controller policy</text>
    </g>
  <g>
      <rect x="925" y="445" width="220" height="105" rx="18" fill="#14223a" stroke="#39c5cf" stroke-width="1.5"/>
      <text x="949" y="483" fill="#39c5cf" font-family="ui-monospace,monospace" font-size="24" font-weight="700">AS</text>
      <text x="989" y="483" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">Codex app-server</text>
      <text x="949" y="517" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">semantics · persistence</text>
    </g>
  <g><path d="M505 325C700 325 770 290 925 305" fill="none" stroke="#e3b341" stroke-width="3"  marker-end="url(#arrow)"/>
      <text x="710" y="290" text-anchor="middle" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="14">frontend transport</text></g>
  <g><path d="M845 345L925 345" fill="none" stroke="#e3b341" stroke-width="3"  marker-end="url(#arrow)"/>
      <text x="885" y="335" text-anchor="middle" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="14">/codex</text></g>
  <g><path d="M1035 380L1035 445" fill="none" stroke="#bc8cff" stroke-width="3"  marker-end="url(#arrow)"/>
      <text x="1035" y="402.5" text-anchor="middle" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="14">provider</text></g>

</svg>
