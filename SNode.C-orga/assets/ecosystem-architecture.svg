<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 675">
  <title id="title">SNodeC ecosystem runtime and build relationships</title>
  <desc id="desc">SNodeC ecosystem runtime and build relationships</desc>
  <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111b2e"/>
      </linearGradient>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#58a6ff" stop-opacity=".95"/>
        <stop offset="1" stop-color="#58a6ff" stop-opacity=".35"/>
      </linearGradient>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
      </pattern>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0 0L10 5L0 10Z" fill="#58a6ff"/>
      </marker>
      <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0 0L10 5L0 10Z" fill="#a9b8cd"/>
      </marker>
    </defs>
  <rect width="1200" height="675" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="675" rx="30" fill="url(#grid)"/>
  <path d="M0 667H1200" stroke="#58a6ff" stroke-width="8" opacity=".9"/>

  <text x="55" y="50" fill="#58a6ff" font-family="Inter,ui-sans-serif,system-ui" font-size="20" font-weight="700" letter-spacing="3">ECOSYSTEM ARCHITECTURE</text>
    <text x="55" y="112" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="48" font-weight="750">Stable layers, independent releases</text>
    <text x="55" y="155" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="22">Solid arrows: runtime communication · Dashed arrows: build/package dependency</text>
  <g>
      <rect x="70" y="220" width="285" height="125" rx="18" fill="#14223a" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="94" y="258" fill="#58a6ff" font-family="ui-monospace,monospace" font-size="24" font-weight="700">S.</text>
      <text x="134" y="258" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">SNode.C</text>
      <text x="94" y="292" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">event loop · sockets</text>
<text x="94" y="317" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">HTTP · WebSocket · TLS</text>
    </g>
  <g>
      <rect x="455" y="160" width="285" height="125" rx="18" fill="#14223a" stroke="#56d364" stroke-width="1.5"/>
      <text x="479" y="198" fill="#56d364" font-family="ui-monospace,monospace" font-size="24" font-weight="700">MQ</text>
      <text x="519" y="198" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">MQTTSuite</text>
      <text x="479" y="232" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">broker · CLI · mapping</text>
<text x="479" y="257" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">bridge · persistence</text>
    </g>
  <g>
      <rect x="455" y="370" width="285" height="125" rx="18" fill="#14223a" stroke="#bc8cff" stroke-width="1.5"/>
      <text x="479" y="408" fill="#bc8cff" font-family="ui-monospace,monospace" font-size="24" font-weight="700">AI</text>
      <text x="519" y="408" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">AISuite</text>
      <text x="479" y="442" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">typed SDKs · routing</text>
<text x="479" y="467" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">controller / observer</text>
    </g>
  <g>
      <rect x="840" y="370" width="285" height="125" rx="18" fill="#14223a" stroke="#e3b341" stroke-width="1.5"/>
      <text x="864" y="408" fill="#e3b341" font-family="ui-monospace,monospace" font-size="24" font-weight="700">UI</text>
      <text x="904" y="408" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">CodexUI</text>
      <text x="864" y="442" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">native Qt · browser</text>
<text x="864" y="467" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">visible workflows</text>
    </g>
  <g><path d="M355 282L455 222" fill="none" stroke="#a9b8cd" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow-muted)"/>
      <text x="405" y="242" text-anchor="middle" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="14">package</text></g>
  <g><path d="M355 282L455 432" fill="none" stroke="#a9b8cd" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow-muted)"/>
      <text x="405" y="347" text-anchor="middle" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="14">package</text></g>
  <g><path d="M740 432L840 432" fill="none" stroke="#bc8cff" stroke-width="3"  marker-end="url(#arrow)"/>
      <text x="790" y="422" text-anchor="middle" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="14">frontend</text></g>
  <g><rect x="470" y="545" width="180" height="36" rx="18" fill="#56d364" fill-opacity=".13" stroke="#56d364"/>
      <text x="560" y="569" text-anchor="middle" fill="#56d364" font-family="Inter,ui-sans-serif,system-ui" font-size="14" font-weight="700">MQTT track</text></g>
  <g><rect x="785" y="545" width="220" height="36" rx="18" fill="#bc8cff" fill-opacity=".13" stroke="#bc8cff"/>
      <text x="895" y="569" text-anchor="middle" fill="#bc8cff" font-family="Inter,ui-sans-serif,system-ui" font-size="14" font-weight="700">Typed Codex track</text></g>

</svg>
