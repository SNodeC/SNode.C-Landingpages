<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1600 800">
  <title id="title">SNodeC ecosystem categories</title>
  <desc id="desc">SNodeC ecosystem categories</desc>
  <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111b2e"/>
      </linearGradient>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#58a6ff" stop-opacity=".95"/>
        <stop offset="1" stop-color="#58a6ff" stop-opacity=".35"/>
      </linearGradient>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
      </pattern>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0 0L10 5L0 10Z" fill="#58a6ff"/>
      </marker>
      <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0 0L10 5L0 10Z" fill="#a9b8cd"/>
      </marker>
    </defs>
  <rect width="1600" height="800" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="800" rx="30" fill="url(#grid)"/>
  <path d="M0 792H1600" stroke="#58a6ff" stroke-width="8" opacity=".9"/>

  <text x="80" y="74" fill="#58a6ff" font-family="Inter,ui-sans-serif,system-ui" font-size="20" font-weight="700" letter-spacing="3">SNODEC ECOSYSTEM</text>
    <text x="80" y="136" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="48" font-weight="750">Build from the network up</text>
    <text x="80" y="179" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="22">Independent layers. Focused projects. Two honest evaluation tracks.</text>
  <g transform="translate(80 245)">
    <g>
      <rect x="0" y="0" width="430" height="300" rx="18" fill="#14223a" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="24" y="38" fill="#58a6ff" font-family="ui-monospace,monospace" font-size="24" font-weight="700">&lt;&gt;</text>
      <text x="64" y="38" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">Networking foundations</text>
      <text x="24" y="72" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">Event-driven C++ building blocks</text>
<text x="24" y="97" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">Address, transport, connection, protocol</text>
    </g>
    <g>
      <rect x="505" y="0" width="430" height="300" rx="18" fill="#14223a" stroke="#56d364" stroke-width="1.5"/>
      <text x="529" y="38" fill="#56d364" font-family="ui-monospace,monospace" font-size="24" font-weight="700">⇄</text>
      <text x="569" y="38" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">Protocols &amp; integrations</text>
      <text x="529" y="72" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">MQTT systems and typed Codex access</text>
<text x="529" y="97" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">Composable, independently versioned</text>
    </g>
    <g>
      <rect x="1010" y="0" width="430" height="300" rx="18" fill="#14223a" stroke="#e3b341" stroke-width="1.5"/>
      <text x="1034" y="38" fill="#e3b341" font-family="ui-monospace,monospace" font-size="24" font-weight="700">▣</text>
      <text x="1074" y="38" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">Applications &amp; interfaces</text>
      <text x="1034" y="72" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">Focused tools and visible workflows</text>
<text x="1034" y="97" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">Native and browser presentations</text>
    </g>
    <g><path d="M430 150L505 150" fill="none" stroke="#58a6ff" stroke-width="3"  marker-end="url(#arrow)"/>
      <text x="467.5" y="140" text-anchor="middle" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="14">build on</text></g>
    <g><path d="M935 150L1010 150" fill="none" stroke="#58a6ff" stroke-width="3"  marker-end="url(#arrow)"/>
      <text x="972.5" y="140" text-anchor="middle" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="14">present</text></g>
  </g>
  <text x="800" y="670" text-anchor="middle" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="18">The categories stay stable as the catalog grows.</text>

</svg>
