<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 675">
  <title id="title">Two separate SNodeC evaluation routes</title>
  <desc id="desc">Two separate SNodeC evaluation routes</desc>
  <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111b2e"/>
      </linearGradient>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#39c5cf" stop-opacity=".95"/>
        <stop offset="1" stop-color="#39c5cf" stop-opacity=".35"/>
      </linearGradient>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
      </pattern>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0 0L10 5L0 10Z" fill="#39c5cf"/>
      </marker>
      <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0 0L10 5L0 10Z" fill="#a9b8cd"/>
      </marker>
    </defs>
  <rect width="1200" height="675" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="675" rx="30" fill="url(#grid)"/>
  <path d="M0 667H1200" stroke="#39c5cf" stroke-width="8" opacity=".9"/>

  <text x="55" y="50" fill="#39c5cf" font-family="Inter,ui-sans-serif,system-ui" font-size="20" font-weight="700" letter-spacing="3">EVALUATION ROUTES</text>
    <text x="55" y="112" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="48" font-weight="750">Choose the outcome you want to see</text>
    <text x="55" y="155" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="22">The tracks share a foundation, not an invented runtime integration.</text>
  <g><rect x="70" y="185" width="230" height="36" rx="18" fill="#56d364" fill-opacity=".13" stroke="#56d364"/>
      <text x="185" y="209" text-anchor="middle" fill="#56d364" font-family="Inter,ui-sans-serif,system-ui" font-size="14" font-weight="700">NETWORKING + MQTT</text></g>
  <g>
      <rect x="70" y="245" width="250" height="120" rx="18" fill="#14223a" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="94" y="283" fill="#58a6ff" font-family="ui-monospace,monospace" font-size="24" font-weight="700">1</text>
      <text x="134" y="283" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">SNode.C</text>
      <text x="94" y="317" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">run echo</text>
<text x="94" y="342" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">observe connection</text>
    </g>
  <g>
      <rect x="420" y="245" width="250" height="120" rx="18" fill="#14223a" stroke="#56d364" stroke-width="1.5"/>
      <text x="444" y="283" fill="#56d364" font-family="ui-monospace,monospace" font-size="24" font-weight="700">2</text>
      <text x="484" y="283" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">MQTTSuite</text>
      <text x="444" y="317" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">publish QoS 1</text>
<text x="444" y="342" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">observe message</text>
    </g>
  <g><path d="M320 305L420 305" fill="none" stroke="#56d364" stroke-width="3"  marker-end="url(#arrow)"/>
      <text x="370" y="295" text-anchor="middle" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="14">then</text></g>
  <g><rect x="70" y="440" width="190" height="36" rx="18" fill="#56d364" fill-opacity=".13" stroke="#56d364"/>
      <text x="165" y="464" text-anchor="middle" fill="#56d364" font-family="Inter,ui-sans-serif,system-ui" font-size="14" font-weight="700">VISIBLE OUTCOME</text></g>
  <text x="285" y="465" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="19">Echo + local MQTT message flow</text>
  <g><rect x="730" y="185" width="230" height="36" rx="18" fill="#bc8cff" fill-opacity=".13" stroke="#bc8cff"/>
      <text x="845" y="209" text-anchor="middle" fill="#bc8cff" font-family="Inter,ui-sans-serif,system-ui" font-size="14" font-weight="700">TYPED CODEX CLIENT</text></g>
  <g>
      <rect x="730" y="245" width="185" height="120" rx="18" fill="#14223a" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="754" y="283" fill="#58a6ff" font-family="ui-monospace,monospace" font-size="24" font-weight="700">1</text>
      <text x="794" y="283" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">SNode.C</text>
      <text x="754" y="317" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">networking</text>
<text x="754" y="342" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">components</text>
    </g>
  <g>
      <rect x="960" y="245" width="185" height="120" rx="18" fill="#14223a" stroke="#bc8cff" stroke-width="1.5"/>
      <text x="984" y="283" fill="#bc8cff" font-family="ui-monospace,monospace" font-size="24" font-weight="700">2</text>
      <text x="1024" y="283" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">AISuite</text>
      <text x="984" y="317" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">bridge</text>
<text x="984" y="342" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">typed access</text>
    </g>
  <g>
      <rect x="845" y="430" width="185" height="120" rx="18" fill="#14223a" stroke="#e3b341" stroke-width="1.5"/>
      <text x="869" y="468" fill="#e3b341" font-family="ui-monospace,monospace" font-size="24" font-weight="700">3</text>
      <text x="909" y="468" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">CodexUI</text>
      <text x="869" y="502" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">native / web</text>
<text x="869" y="527" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">workflow</text>
    </g>
  <g><path d="M915 305L960 305" fill="none" stroke="#bc8cff" stroke-width="3"  marker-end="url(#arrow)"/>
      </g>
  <g><path d="M1052 365C1052 405 1015 430 990 445" fill="none" stroke="#bc8cff" stroke-width="3"  marker-end="url(#arrow)"/>
      </g>

</svg>
