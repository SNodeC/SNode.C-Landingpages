<text fill="#0F172A" style="white-space: pre" xml:space="preserve" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="bold" letter-spacing="0em"><tspan x="34" y="88.9091">Replace context. Keep connection.</tspan></text>
<text fill="#475569" style="white-space: pre" xml:space="preserve" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" letter-spacing="0em"><tspan x="34" y="121.864">Stage while HTTP is active. Commit after the read callback.</tspan></text>
