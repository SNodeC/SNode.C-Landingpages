<svg role="img" aria-labelledby="title desc" viewBox="0 0 620 1320" fill="none" xmlns="http://www.w3.org/2000/svg">
<title id="title">SNode.C HTTP to WebSocket context replacement — mobile</title>
<desc id="desc">Mobile chronology of the context switch: prepare the WebSocket replacement, stage it while HTTP remains active, then commit the switch after the read callback. The same SocketConnection remains established.</desc>
