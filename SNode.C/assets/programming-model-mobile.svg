<svg role="img" aria-labelledby="title desc" viewBox="0 0 620 980" fill="none" xmlns="http://www.w3.org/2000/svg">
<title id="title">SNode.C programming model — mobile</title>
<desc id="desc">A mobile-first reading of the SNode.C programming model: server or client endpoint flow, each with its own factory, then SocketConnection, create(this) on that flow’s retained factory, one active SocketContext, and the caller-thread start() event loop.</desc>
