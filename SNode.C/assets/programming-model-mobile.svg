<text fill="#0F172A" style="white-space: pre" xml:space="preserve" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="bold" letter-spacing="0em"><tspan x="56" y="220.182">SocketServer</tspan></text>
<text fill="#2563EB" style="white-space: pre" xml:space="preserve" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" letter-spacing="0em"><tspan x="56" y="252.864">listen &#x2192; accept</tspan></text>
