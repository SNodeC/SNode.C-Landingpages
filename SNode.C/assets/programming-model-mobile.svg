<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 980" role="img" aria-labelledby="title desc">
<title id="title">SNode.C programming model — mobile</title>
<desc id="desc">A mobile-first reading of the SNode.C programming model: server or client endpoint flow, each with its own context factory, then SocketConnection, create(this) on that flow's retained factory, one active SocketContext, and the caller-thread start() event loop.</desc>
<rect x="0.5" y="0.5" width="619" height="979" rx="23.5" fill="#F8FAFC" stroke="#CCD5E0" stroke-width="1"/>
<text x="34" y="28" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">PROGRAMMING MODEL</text>
<text x="34" y="60" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" dominant-baseline="hanging">Endpoint → connection → context</text>
<text x="34" y="102" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="400" text-anchor="start" dominant-baseline="hanging">Each endpoint flow owns its own factory.</text>
<rect x="34.75" y="150.75" width="550.5" height="138.5" rx="17.25" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="56" y="166" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">SERVER ENDPOINT FLOW</text>
<text x="56" y="193" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" dominant-baseline="hanging">SocketServer</text>
<text x="56" y="233" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">listen → accept</text>
<rect x="254" y="232" width="310" height="38" rx="10" fill="#EFF6FF"/>
<text x="268" y="239" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">own context factory</text>
<text x="292" y="300" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">OR</text>
<rect x="34.75" y="332.75" width="550.5" height="138.5" rx="17.25" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="56" y="348" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">CLIENT ENDPOINT FLOW</text>
<text x="56" y="375" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" dominant-baseline="hanging">SocketClient</text>
<text x="56" y="415" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">connect completes</text>
<rect x="254" y="414" width="310" height="38" rx="10" fill="#EFF6FF"/>
<text x="268" y="421" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">own context factory</text>
<text x="294" y="478" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="600" text-anchor="start" dominant-baseline="hanging">↓</text>
<rect x="35" y="519" width="550" height="104" rx="17" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="56" y="536" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" dominant-baseline="hanging">SocketConnection</text>
<text x="56" y="580" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="400" text-anchor="start" dominant-baseline="hanging">established stream · owns active context</text>
<rect x="34" y="646" width="552" height="62" rx="14" fill="#EFF6FF"/>
<text x="54" y="664" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">↓  create(this) on that flow’s retained factory</text>
<rect x="34.75" y="730.75" width="550.5" height="104.5" rx="17.25" fill="#ECFCF6" stroke="#11A474" stroke-width="1.5"/>
<text x="56" y="747" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" dominant-baseline="hanging">SocketContext</text>
<text x="52" y="792" fill="#057959" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">one active context · connection-local behavior</text>
<rect x="34" y="858" width="552" height="104" rx="16" fill="#0F172A"/>
<text x="54" y="875" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="hanging">Event loop · start()</text>
<text x="46" y="912" fill="#CBD5E3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="500" text-anchor="start" dominant-baseline="hanging">caller-thread dispatch · readiness · timers · callbacks</text>
</svg>
