<text fill="#0F172A" style="white-space: pre" xml:space="preserve" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="bold" letter-spacing="0em"><tspan x="56" y="775.909">SocketContext</tspan></text>
<text fill="#057959" style="white-space: pre" xml:space="preserve" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" letter-spacing="0em"><tspan x="56" y="811.864">one active context &#xb7; connection-local behavior</tspan></text>
