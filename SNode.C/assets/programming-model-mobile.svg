<rect x="0.5" y="0.5" width="619" height="979" rx="23.5" stroke="#CCD5E0"/>
<text fill="#2563EB" style="white-space: pre" xml:space="preserve" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" letter-spacing="0em"><tspan x="34" y="47.8636">PROGRAMMING MODEL</tspan></text>
<text fill="#0F172A" style="white-space: pre" xml:space="preserve" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="bold" letter-spacing="0em"><tspan x="34" y="88.9091">Endpoint &#x2192; connection &#x2192; context</tspan></text>
<text fill="#475569" style="white-space: pre" xml:space="preserve" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" letter-spacing="0em"><tspan x="34" y="121.864">Each endpoint flow owns its own factory.</tspan></text>
