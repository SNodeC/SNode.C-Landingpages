<text fill="#475569" style="white-space: pre" xml:space="preserve" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" letter-spacing="0em"><tspan x="56" y="599.864">established stream &#xb7; owns active context</tspan></text>
