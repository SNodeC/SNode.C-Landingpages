<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 675">
  <title id="title">SNode.C SocketServer and SocketClient programming model</title>
  <desc id="desc">SNode.C SocketServer and SocketClient programming model</desc>
  <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111b2e"/>
      </linearGradient>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#58a6ff" stop-opacity=".95"/>
        <stop offset="1" stop-color="#58a6ff" stop-opacity=".35"/>
      </linearGradient>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
      </pattern>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0 0L10 5L0 10Z" fill="#58a6ff"/>
      </marker>
      <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0 0L10 5L0 10Z" fill="#a9b8cd"/>
      </marker>
    </defs>
  <rect width="1200" height="675" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="675" rx="30" fill="url(#grid)"/>
  <path d="M0 667H1200" stroke="#58a6ff" stroke-width="8" opacity=".9"/>

  <text x="55" y="50" fill="#58a6ff" font-family="Inter,ui-sans-serif,system-ui" font-size="20" font-weight="700" letter-spacing="3">PROGRAMMING MODEL</text>
    <text x="55" y="112" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="38" font-weight="750">Configuration becomes connection-local behavior</text>
    <text x="55" y="155" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="22">Factories create one context per accepted or established connection.</text>
  <g>
      <rect x="70" y="230" width="260" height="130" rx="18" fill="#14223a" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="94" y="268" fill="#58a6ff" font-family="ui-monospace,monospace" font-size="24" font-weight="700">S</text>
      <text x="134" y="268" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">SocketServer</text>
      <text x="94" y="302" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">accepts connections</text>
<text x="94" y="327" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">owns listener instance</text>
    </g>
  <g>
      <rect x="70" y="420" width="260" height="130" rx="18" fill="#14223a" stroke="#39c5cf" stroke-width="1.5"/>
      <text x="94" y="458" fill="#39c5cf" font-family="ui-monospace,monospace" font-size="24" font-weight="700">C</text>
      <text x="134" y="458" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">SocketClient</text>
      <text x="94" y="492" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">initiates connection</text>
<text x="94" y="517" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">owns client instance</text>
    </g>
  <g>
      <rect x="465" y="325" width="280" height="145" rx="18" fill="#14223a" stroke="#bc8cff" stroke-width="3"/>
      <text x="489" y="363" fill="#bc8cff" font-family="ui-monospace,monospace" font-size="24" font-weight="700">F</text>
      <text x="529" y="363" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">SocketContextFactory</text>
      <text x="489" y="397" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">selects application context</text>
<text x="489" y="422" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">constructs per connection</text>
    </g>
  <g>
      <rect x="875" y="325" width="260" height="145" rx="18" fill="#14223a" stroke="#56d364" stroke-width="3"/>
      <text x="899" y="363" fill="#56d364" font-family="ui-monospace,monospace" font-size="24" font-weight="700">CTX</text>
      <text x="939" y="363" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">SocketContext</text>
      <text x="899" y="397" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">connected · data · close</text>
<text x="899" y="422" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">application callbacks</text>
    </g>
  <g><path d="M330 295C395 295 410 365 465 380" fill="none" stroke="#58a6ff" stroke-width="3"  marker-end="url(#arrow)"/>
      <text x="395" y="300" text-anchor="middle" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="14">accepted</text></g>
  <g><path d="M330 485C395 485 410 430 465 415" fill="none" stroke="#58a6ff" stroke-width="3"  marker-end="url(#arrow)"/>
      <text x="398" y="486" text-anchor="middle" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="14">established</text></g>
  <g><path d="M745 397L875 397" fill="none" stroke="#58a6ff" stroke-width="3"  marker-end="url(#arrow)"/>
      <text x="810" y="387" text-anchor="middle" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="14">create</text></g>

</svg>
