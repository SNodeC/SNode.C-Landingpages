<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SNode.C programming model</title>
  <desc id="desc">A configured server or client instance accepts or establishes a connection. A SocketContextFactory creates one SocketContext for that connection, which receives attach, data, and detach callbacks.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#20304a" stroke-width="1" opacity=".34"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#5ca8ff"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="32" fill="#0b1425"/>
  <rect width="1600" height="900" rx="32" fill="url(#grid)"/>
  <rect y="890" width="1600" height="10" fill="#5ca8ff"/>

  <text x="76" y="68" fill="#5ca8ff" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="700" letter-spacing="6">PROGRAMMING MODEL</text>
  <text x="76" y="145" fill="#f5f8ff" font-family="Inter,Segoe UI,sans-serif" font-size="52" font-weight="750">One context for each connection</text>
  <text x="76" y="198" fill="#aebbd0" font-family="Inter,Segoe UI,sans-serif" font-size="27">Endpoint mechanics stay outside application protocol state.</text>

  <rect x="76" y="285" width="330" height="220" rx="28" fill="#152640" stroke="#5ca8ff" stroke-width="3"/>
  <text x="112" y="340" fill="#5ca8ff" font-family="ui-monospace,SFMono-Regular,monospace" font-size="28" font-weight="700">INSTANCE</text>
  <text x="112" y="390" fill="#f5f8ff" font-family="Inter,Segoe UI,sans-serif" font-size="32" font-weight="700">SocketServer</text>
  <text x="112" y="430" fill="#f5f8ff" font-family="Inter,Segoe UI,sans-serif" font-size="32" font-weight="700">or SocketClient</text>
  <text x="112" y="474" fill="#aebbd0" font-family="Inter,Segoe UI,sans-serif" font-size="23">named endpoint · configured role</text>

  <path d="M406 395H520" stroke="#5ca8ff" stroke-width="5" fill="none" marker-end="url(#arrow)"/>

  <rect x="544" y="285" width="320" height="220" rx="28" fill="#152640" stroke="#38cad6" stroke-width="3"/>
  <text x="580" y="340" fill="#38cad6" font-family="ui-monospace,SFMono-Regular,monospace" font-size="28" font-weight="700">CONNECTION</text>
  <text x="580" y="394" fill="#f5f8ff" font-family="Inter,Segoe UI,sans-serif" font-size="31" font-weight="700">SocketConnection</text>
  <text x="580" y="438" fill="#aebbd0" font-family="Inter,Segoe UI,sans-serif" font-size="23">addresses · queues · timeouts</text>
  <text x="580" y="474" fill="#aebbd0" font-family="Inter,Segoe UI,sans-serif" font-size="23">plain stream or TLS</text>

  <path d="M864 395H978" stroke="#5ca8ff" stroke-width="5" fill="none" marker-end="url(#arrow)"/>

  <rect x="1002" y="285" width="522" height="220" rx="28" fill="#152640" stroke="#b583ff" stroke-width="3"/>
  <text x="1040" y="340" fill="#b583ff" font-family="ui-monospace,SFMono-Regular,monospace" font-size="28" font-weight="700">FACTORY</text>
  <text x="1040" y="394" fill="#f5f8ff" font-family="Inter,Segoe UI,sans-serif" font-size="32" font-weight="700">SocketContextFactory</text>
  <text x="1040" y="438" fill="#aebbd0" font-family="Inter,Segoe UI,sans-serif" font-size="23">chooses application behavior</text>
  <text x="1040" y="474" fill="#aebbd0" font-family="Inter,Segoe UI,sans-serif" font-size="23">creates exactly one attached context</text>

  <path d="M1263 505V590" stroke="#5ca8ff" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <text x="1284" y="558" fill="#aebbd0" font-family="Inter,Segoe UI,sans-serif" font-size="21">create</text>

  <rect x="690" y="615" width="834" height="172" rx="28" fill="#152640" stroke="#55d86f" stroke-width="3"/>
  <text x="730" y="670" fill="#55d86f" font-family="ui-monospace,SFMono-Regular,monospace" font-size="28" font-weight="700">CONNECTION-LOCAL CONTEXT</text>
  <text x="730" y="722" fill="#f5f8ff" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="700">SocketContext</text>
  <text x="1015" y="722" fill="#aebbd0" font-family="Inter,Segoe UI,sans-serif" font-size="23">onConnected → data / send → onDisconnected</text>
  <text x="730" y="757" fill="#aebbd0" font-family="Inter,Segoe UI,sans-serif" font-size="20">Application protocol state lives here.</text>
  <text x="1095" y="757" fill="#aebbd0" font-family="Inter,Segoe UI,sans-serif" font-size="20">Socket ownership remains with the connection.</text>

  <path d="M704 505V701H690" stroke="#38cad6" stroke-width="3" stroke-dasharray="10 10" fill="none"/>
  <text x="76" y="705" fill="#f5f8ff" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="700">Lifecycle boundary</text>
  <text x="76" y="748" fill="#aebbd0" font-family="Inter,Segoe UI,sans-serif" font-size="23">A context detaches on connection close</text>
  <text x="76" y="782" fill="#aebbd0" font-family="Inter,Segoe UI,sans-serif" font-size="23">or when another protocol context takes over.</text>
</svg>
