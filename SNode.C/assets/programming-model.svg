<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1000" role="img" aria-labelledby="title desc">
  <title id="title">SNode.C programming model</title>
  <desc id="desc">SocketServer and SocketClient have distinct establishment flows and each retains its own SocketContextFactory. Listen and accept or completed client connection establishment converge on one established SocketConnection. The connection invokes the originating endpoint flow's retained factory with create(this); it returns one active per-connection SocketContext. The event loop is driven by start() on the caller thread and no framework worker pool is implied.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10Z" fill="#1D4ED8"/></marker>
    <style>
      .canvas{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:2}.card{fill:#FFFFFF;stroke:#94A3B8;stroke-width:2}.primary{fill:#FFFFFF;stroke:#1D4ED8;stroke-width:3}.soft{fill:#EFF6FF;stroke:#93C5FD;stroke-width:2}.rail{fill:#EAF2FF;stroke:#1D4ED8;stroke-width:3}
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#0F172A}.label{font:700 32px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#0F172A}.body{font:500 29px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#475569}.small{font:600 28px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#475569}.api{font:700 29px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;fill:#0F172A}.accent{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1D4ED8}
      .runtime{fill:none;stroke:#1D4ED8;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="canvas" x="1" y="1" width="858" height="998" rx="24"/>
  <text class="title" x="430" y="50" text-anchor="middle">Two endpoint flows, one connection-local model</text>

  <rect class="card" x="36" y="82" width="374" height="156" rx="20"/>
  <text class="label" x="64" y="126">SocketServer</text>
  <text class="accent" x="64" y="170">listen → accept</text>
  <text class="body" x="64" y="211">retains its own factory</text>

  <rect class="card" x="450" y="82" width="374" height="156" rx="20"/>
  <text class="label" x="478" y="126">SocketClient</text>
  <text class="accent" x="478" y="170">connect completes</text>
  <text class="body" x="478" y="211">retains its own factory</text>

  <path class="runtime" d="M223 238 V268 C223 290 300 290 350 304"/>
  <path class="runtime" d="M637 238 V268 C637 290 560 290 510 304"/>

  <rect class="primary" x="160" y="306" width="540" height="142" rx="22"/>
  <text class="label" x="430" y="354" text-anchor="middle">SocketConnection</text>
  <text class="body" x="430" y="397" text-anchor="middle">established connection</text>
  <text class="small" x="430" y="432" text-anchor="middle">both endpoint paths converge here</text>

  <path class="runtime" d="M430 448 V494"/>
  <text class="accent" x="454" y="480">create(this)</text>

  <rect class="soft" x="160" y="500" width="540" height="142" rx="22"/>
  <text class="api" x="430" y="548" text-anchor="middle">SocketContextFactory</text>
  <text class="body" x="430" y="590" text-anchor="middle">the originating endpoint's retained factory</text>
  <text class="small" x="430" y="625" text-anchor="middle">server and client factories are distinct</text>

  <path class="runtime" d="M430 642 V688"/>
  <text class="accent" x="454" y="675">returns new</text>

  <rect class="primary" x="160" y="694" width="540" height="136" rx="22"/>
  <text class="label" x="430" y="742" text-anchor="middle">SocketContext</text>
  <text class="accent" x="430" y="785" text-anchor="middle">one active per connection</text>
  <text class="body" x="430" y="818" text-anchor="middle">protocol and application callbacks</text>

  <rect class="rail" x="36" y="850" width="788" height="130" rx="18"/>
  <text class="label" x="62" y="889">Event loop — start()</text>
  <text class="small" x="62" y="925">caller-thread dispatch · no framework worker pool</text>
  <text class="body" x="62" y="966">readiness · timers · lifecycle · data callbacks</text>
</svg>
