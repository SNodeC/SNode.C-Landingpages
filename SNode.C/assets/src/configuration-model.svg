<text fill="#0F172A" style="white-space: pre" xml:space="preserve" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" letter-spacing="0em"><tspan x="52" y="101.136">One endpoint policy, three configuration surfaces</tspan></text>
