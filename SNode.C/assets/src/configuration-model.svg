<svg role="img" aria-labelledby="title desc" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
<title id="title">SNode.C configuration model — desktop</title>
<desc id="desc">C++ API defaults, configuration-file values, and command-line overrides have precedence one through three. They feed one named server or client endpoint with relevant configuration sections.</desc>
