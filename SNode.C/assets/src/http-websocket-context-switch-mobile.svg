<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 1320" role="img" aria-labelledby="title desc">
<title id="title">SNode.C HTTP to WebSocket context replacement — mobile</title>
<desc id="desc">Mobile chronology of the context switch: prepare the WebSocket replacement, stage it while HTTP remains active, then commit the switch after the read callback. The same SocketConnection remains established.</desc>
<rect x="0.5" y="0.5" width="619" height="1319" rx="23.5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="34" y="28" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">HTTP → WEBSOCKET</text>
<text x="34" y="60" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="29.5" font-weight="700" text-anchor="start" dominant-baseline="hanging">Replace context. Keep connection.</text>
<text x="34" y="102" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="400" text-anchor="start" dominant-baseline="hanging">Stage while HTTP is active. Commit after the callback.</text>
<rect x="34.75" y="150.75" width="550.5" height="86.5" rx="15.25" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="54" y="164" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">ACTIVE BEFORE</text>
<text x="54" y="189" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" dominant-baseline="hanging">HTTP SocketContext</text>
<rect x="34.75" y="260.75" width="550.5" height="256.5" rx="17.25" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="56" y="278" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">01 · PREPARE</text>
<text x="56" y="318" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">1</text>
<text x="96" y="317" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start" dominant-baseline="hanging">Accepted HTTP Upgrade</text>
<text x="56" y="366" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">2</text>
<text x="96" y="365" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start" dominant-baseline="hanging">WebSocket factory selected</text>
<text x="56" y="414" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">3</text>
<text x="96" y="413" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start" dominant-baseline="hanging">Replacement context created</text>
<text x="56" y="462" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">4</text>
<text x="96" y="461" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start" dominant-baseline="hanging">101 Switching Protocols prepared</text>
<rect x="34.75" y="540.75" width="550.5" height="224.5" rx="17.25" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="56" y="558" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">02 · STAGE</text>
<text x="56" y="598" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">5</text>
<text x="96" y="597" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start" dominant-baseline="hanging">setSocketContext(new)</text>
<text x="96" y="628" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="400" text-anchor="start" dominant-baseline="hanging">stages replacement; HTTP remains active</text>
<text x="56" y="668" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">6</text>
<text x="96" y="667" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start" dominant-baseline="hanging">Application/status callback</text>
<text x="96" y="698" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="400" text-anchor="start" dominant-baseline="hanging">calls response-&gt;end() · queues the 101</text>
<rect x="34.75" y="788.75" width="550.5" height="322.5" rx="17.25" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="56" y="806" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">03 · COMMIT AFTER CALLBACK</text>
<text x="56" y="846" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">7</text>
<text x="96" y="845" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">HTTP read callback returns</text>
<text x="56" y="894" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">8</text>
<text x="96" y="893" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">detach(ContextSwitch)</text>
<text x="56" y="942" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">9</text>
<text x="96" y="941" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">old HTTP context removed</text>
<text x="56" y="990" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">10</text>
<text x="96" y="989" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">active-context pointer changes</text>
<text x="56" y="1038" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">11</text>
<text x="96" y="1037" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">SocketContextUpgrade::attach()</text>
<rect x="34.75" y="1134.75" width="550.5" height="86.5" rx="15.25" fill="#ECFCF6" stroke="#11A474" stroke-width="1.5"/>
<text x="54" y="1148" fill="#057959" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="600" text-anchor="start" dominant-baseline="hanging">ACTIVE AFTER</text>
<text x="54" y="1173" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="hanging">SocketContextUpgrade</text>
<rect x="34" y="1238" width="552" height="76" rx="16" fill="#0F172A"/>
<text x="54" y="1256" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="700" text-anchor="start" dominant-baseline="hanging">same SocketConnection · no second transport</text>
<text x="54" y="1285" fill="#CBD5E3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.25" font-weight="400" text-anchor="start" dominant-baseline="hanging">connection identity and stream remain established</text>
</svg>
