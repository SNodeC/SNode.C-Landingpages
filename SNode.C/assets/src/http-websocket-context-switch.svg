<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">SNode.C HTTP to WebSocket context replacement</title>
  <desc id="desc">After an accepted HTTP Upgrade, a WebSocket upgrade factory is selected and creates a replacement context. The 101 Switching Protocols response is prepared, setSocketContext(new) stages the replacement while the HTTP context remains active, and the upgrade-status or application callback calls response-&gt;end() to queue the 101. After the current HTTP read callback returns, the HTTP context detaches with DetachReason::ContextSwitch and is removed, the active-context pointer changes to the staged replacement, and SocketContextUpgrade attaches. The same SocketConnection remains established and no second transport connection is created.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#1D4ED8"/></marker>
    <style>
      .canvas{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:2}.card{fill:#FFFFFF;stroke:#94A3B8;stroke-width:2}.primary{fill:#FFFFFF;stroke:#1D4ED8;stroke-width:4}.stage{fill:#EFF6FF;stroke:#93C5FD;stroke-width:2.5}.rail{fill:#EAF2FF;stroke:#1D4ED8;stroke-width:4}
      .phase{font:700 36px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#64748B;letter-spacing:2px}.label{font:700 42px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#0F172A}.body{font:500 38px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#475569}.small{font:600 36px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#475569}.api{font:700 36px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;fill:#0F172A}.accent{font:700 38px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1D4ED8}
      .runtime{fill:none;stroke:#1D4ED8;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.assoc{fill:none;stroke:#64748B;stroke-width:3;stroke-linecap:round}
    </style>
  </defs>
  <rect class="canvas" x="1" y="1" width="1438" height="898" rx="30"/>

  <text class="phase" x="198" y="58" text-anchor="middle">HTTP</text>
  <text class="phase" x="720" y="58" text-anchor="middle">STAGED SWITCH</text>
  <text class="phase" x="1242" y="58" text-anchor="middle">WEBSOCKET</text>

  <rect class="primary" x="38" y="92" width="320" height="410" rx="26"/>
  <text class="label" x="198" y="154" text-anchor="middle">HTTP</text>
  <text class="api" x="198" y="204" text-anchor="middle">SocketContext</text>
  <text class="accent" x="198" y="256" text-anchor="middle">ACTIVE context</text>
  <text class="body" x="198" y="334" text-anchor="middle">1  accepted</text>
  <text class="body" x="198" y="380" text-anchor="middle">HTTP Upgrade</text>
  <text class="small" x="198" y="438" text-anchor="middle">read callback</text>
  <text class="small" x="198" y="476" text-anchor="middle">running</text>

  <path class="runtime" d="M358 288 H382"/>

  <rect class="stage" x="396" y="92" width="648" height="410" rx="26"/>
  <text class="label" x="430" y="150">Prepare and stage replacement</text>
  <text class="body" x="430" y="205">2  WebSocket factory selected</text>
  <text class="body" x="468" y="247">→ replacement context created</text>
  <text class="body" x="430" y="297">3  <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-weight="700">101</tspan> response prepared</text>
  <text class="body" x="430" y="347">4  <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-weight="700">setSocketContext(new)</tspan></text>
  <text class="small" x="468" y="380">replacement STAGED</text>
  <text class="small" x="468" y="417">HTTP context still ACTIVE</text>
  <text class="body" x="430" y="458">5  application/status callback</text>
  <text class="body" x="468" y="494"><tspan font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-weight="700">response-&gt;end()</tspan> queues 101</text>

  <path class="runtime" d="M1044 288 H1068"/>

  <rect class="primary" x="1082" y="92" width="320" height="410" rx="26"/>
  <text class="label" x="1242" y="154" text-anchor="middle">WebSocket</text>
  <text class="api" x="1242" y="204" text-anchor="middle">SocketContext</text>
  <text class="api" x="1242" y="248" text-anchor="middle">Upgrade</text>
  <text class="body" x="1124" y="334">6  HTTP read</text>
  <text class="body" x="1154" y="380">callback returns</text>
  <text class="accent" x="1242" y="438" text-anchor="middle">ACTIVE after</text>
  <text class="accent" x="1242" y="480" text-anchor="middle">attach()</text>

  <text class="small" x="720" y="544" text-anchor="middle">7  switch completes after the current HTTP read callback</text>

  <rect class="card" x="38" y="572" width="290" height="120" rx="22"/>
  <text class="api" x="183" y="618" text-anchor="middle">detach</text>
  <text class="small" x="183" y="666" text-anchor="middle">ContextSwitch</text>
  <path class="runtime" d="M328 632 H356"/>

  <rect class="card" x="370" y="572" width="285" height="120" rx="22"/>
  <text class="body" x="512" y="620" text-anchor="middle" font-weight="700">old HTTP context</text>
  <text class="small" x="512" y="666" text-anchor="middle">removed</text>
  <path class="runtime" d="M655 632 H683"/>

  <rect class="card" x="697" y="572" width="340" height="120" rx="22"/>
  <text class="body" x="867" y="620" text-anchor="middle" font-weight="700">active pointer</text>
  <text class="small" x="867" y="666" text-anchor="middle">→ staged replacement</text>
  <path class="runtime" d="M1037 632 H1065"/>

  <rect class="card" x="1079" y="572" width="323" height="120" rx="22"/>
  <text class="api" x="1240" y="615" text-anchor="middle">attach()</text>
  <text class="small" x="1240" y="655" text-anchor="middle">SocketContext</text>
  <text class="small" x="1240" y="684" text-anchor="middle">Upgrade</text>

  <path class="assoc" d="M176 502 V724 M1258 502 V724"/>
  <rect class="rail" x="38" y="724" width="1364" height="140" rx="24"/>
  <text class="label" x="720" y="776" text-anchor="middle">same SocketConnection remains established</text>
  <text class="body" x="720" y="820" text-anchor="middle">stream · addresses · identity · connection mode retained</text>
  <text class="accent" x="720" y="856" text-anchor="middle">no second transport connection is created</text>
</svg>
