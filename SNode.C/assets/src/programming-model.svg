<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">SNode.C programming model</title>
  <desc id="desc">SocketServer and SocketClient have distinct establishment flows and each retains its own SocketContextFactory. Listen and accept or a completed client connection converge on an established SocketConnection. The connection calls the matching retained factory with create(this), which produces one active per-connection SocketContext. The event loop is driven by start().</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0 0L12 6L0 12Z" fill="#1D4ED8"/></marker>
    <style>
      .canvas{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:2}.card{fill:#FFFFFF;stroke:#94A3B8;stroke-width:2}.primary{fill:#FFFFFF;stroke:#1D4ED8;stroke-width:4}.soft{fill:#EFF6FF;stroke:#93C5FD;stroke-width:2}.rail{fill:#EAF2FF;stroke:#1D4ED8;stroke-width:3}
      .title{font:700 38px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#0F172A}.label{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#0F172A}.body{font:500 34px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#475569}.small{font:600 31px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#475569}.api{font:700 31px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;fill:#0F172A}.accent{font:700 29px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1D4ED8}
      .runtime{fill:none;stroke:#1D4ED8;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.dispatch{fill:none;stroke:#1D4ED8;stroke-width:3.5;stroke-linecap:round;marker-end:url(#arrow)}.assoc{fill:none;stroke:#64748B;stroke-width:2.5;stroke-linecap:round}
    </style>
  </defs>
  <rect class="canvas" x="1" y="1" width="1278" height="718" rx="28"/>
  <text class="title" x="48" y="54">Distinct endpoint flows, one connection-local context model</text>

  <rect class="card" x="48" y="84" width="350" height="168" rx="22"/>
  <rect x="48" y="84" width="8" height="168" rx="4" fill="#1D4ED8"/>
  <text class="label" x="80" y="132">SocketServer</text>
  <text class="accent" x="80" y="174">listen → accept</text>
  <text class="body" x="80" y="220">retains its own factory</text>

  <rect class="card" x="48" y="292" width="350" height="168" rx="22"/>
  <rect x="48" y="292" width="8" height="168" rx="4" fill="#1D4ED8"/>
  <text class="label" x="80" y="340">SocketClient</text>
  <text class="accent" x="80" y="382">connect completes</text>
  <text class="body" x="80" y="428">retains its own factory</text>

  <path class="runtime" d="M398 164 C438 164 438 214 470 214"/>
  <path class="runtime" d="M398 372 C438 372 438 300 470 300"/>

  <rect class="primary" x="470" y="166" width="300" height="176" rx="24"/>
  <text class="label" x="620" y="220" text-anchor="middle">SocketConnection</text>
  <text class="body" x="620" y="264" text-anchor="middle">established connection</text>
  <text class="body" x="620" y="306" text-anchor="middle">owns one active context</text>

  <text class="accent" x="875" y="194" text-anchor="middle">create(this)</text>
  <path class="runtime" d="M770 224 H968"/>

  <rect class="soft" x="980" y="98" width="252" height="184" rx="22"/>
  <text class="small" x="1106" y="136" text-anchor="middle">originating endpoint's</text>
  <text class="small" x="1106" y="170" text-anchor="middle">retained factory</text>
  <text class="api" x="1106" y="216" text-anchor="middle">SocketContext</text>
  <text class="api" x="1106" y="252" text-anchor="middle">Factory</text>

  <path class="runtime" d="M1106 282 V334"/>
  <text class="accent" x="1004" y="322">returns new</text>

  <rect class="primary" x="980" y="348" width="252" height="148" rx="22"/>
  <text class="label" x="1106" y="400" text-anchor="middle">SocketContext</text>
  <text class="accent" x="1106" y="442" text-anchor="middle">one active</text>
  <text class="body" x="1106" y="480" text-anchor="middle">per connection</text>

  <path class="assoc" d="M770 322 H900 V422 H980"/>

  <rect class="rail" x="48" y="552" width="1184" height="124" rx="22"/>
  <text class="label" x="82" y="600">Event loop — start()</text>
  <text class="body" x="82" y="642">descriptor readiness · timers · lifecycle/data callbacks · caller-thread dispatch</text>
  <text class="small" x="1196" y="600" text-anchor="end">no framework worker pool</text>
  <path class="dispatch" d="M220 552 V486"/>
  <path class="dispatch" d="M620 552 V360"/>
  <path class="dispatch" d="M1106 552 V510"/>
</svg>
