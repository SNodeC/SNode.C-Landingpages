<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">SNode.C programming model — desktop</title>
<desc id="desc">Two distinct server and client endpoint flows each own a SocketContextFactory. Both establishment paths converge on SocketConnection, which calls the owning flow&#x27;s retained factory with create(this) to create one active per-connection SocketContext. start() drives caller-thread event dispatch.</desc>
<rect x="0.5" y="0.5" width="1199" height="719" rx="24" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="51" y="39" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" dominant-baseline="hanging">PROGRAMMING MODEL</text>
<text x="51" y="69" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start" dominant-baseline="hanging">Two endpoint flows, one connection-local model</text>
<text x="51" y="113" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="hanging">Each configured flow owns its factory; established connections create one active context.</text>
<rect x="51" y="175" width="500" height="164" rx="18" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="73.5" y="191.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="hanging">SERVER ENDPOINT FLOW</text>
<text x="73.5" y="218.5" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start" dominant-baseline="hanging">SocketServer</text>
<text x="73.5" y="257.5" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start" dominant-baseline="hanging">listen → accept</text>
<rect x="323.5" y="264.5" width="202" height="42" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
<text x="336.5" y="274.5" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start" dominant-baseline="hanging">own SocketContextFactory</text>
<rect x="647" y="175" width="500" height="164" rx="18" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="669.5" y="191.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="hanging">CLIENT ENDPOINT FLOW</text>
<text x="669.5" y="218.5" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start" dominant-baseline="hanging">SocketClient</text>
<text x="669.5" y="257.5" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start" dominant-baseline="hanging">connect completes</text>
<rect x="919.5" y="264.5" width="202" height="42" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
<text x="932.5" y="274.5" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start" dominant-baseline="hanging">own SocketContextFactory</text>
<text x="301" y="327" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="600" text-anchor="start" dominant-baseline="hanging">↘</text>
<text x="865" y="327" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="600" text-anchor="start" dominant-baseline="hanging">↙</text>
<rect x="349" y="371" width="500" height="100" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="371" y="389" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start" dominant-baseline="hanging">SocketConnection</text>
<text x="371" y="427" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="hanging">established stream · connection identity · active-context owner</text>
<rect x="349" y="485" width="500" height="52" rx="14" fill="#EFF6FF"/>
<text x="371" y="500" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start" dominant-baseline="hanging">↓  create(this) on the owning endpoint flow’s retained factory</text>
<rect x="349" y="551" width="500" height="78" rx="18" fill="#ECFCF6" stroke="#11A474" stroke-width="1.5"/>
<text x="371.5" y="566.5" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start" dominant-baseline="hanging">SocketContext</text>
<text x="371.5" y="604.5" fill="#057959" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="hanging">one active context · connection-local behavior</text>
<rect x="51" y="645" width="1096" height="58" rx="16" fill="#0F172A"/>
<text x="73" y="662" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="hanging">Event loop · start()</text>
<text x="261" y="663" fill="#CBD5E3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start" dominant-baseline="hanging">caller-thread dispatch · descriptor readiness · timers · lifecycle/data callbacks</text>
