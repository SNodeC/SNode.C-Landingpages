<svg role="img" aria-labelledby="title desc" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
<title id="title">SNode.C architecture by composition — desktop</title>
<desc id="desc">Five layers show application context, connection mode, endpoint role, address family, and event runtime. Application contexts include custom stream, HTTP/Express-style, SSE/EventSource, WebSocket, and MQTT; Bluetooth RFCOMM and L2CAP are marked source-only.</desc>
