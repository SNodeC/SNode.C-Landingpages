<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">SNode.C configuration model — desktop</title>
<desc id="desc">C++ API defaults, configuration-file values, and command-line overrides have precedence one through three. They feed one named server or client endpoint with relevant configuration sections.</desc>
<rect x="0.5" y="0.5" width="1199" height="699" rx="24" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="51" y="37" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" dominant-baseline="hanging">CONFIGURATION MODEL</text>
<text x="51" y="69" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start" dominant-baseline="hanging">One endpoint policy, three configuration surfaces</text>
<text x="51" y="113" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="hanging">Later inputs override earlier defaults; the endpoint keeps one typed configuration hierarchy.</text>
<text x="51" y="161" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="hanging">PRECEDENCE · 1 → 2 → 3</text>
<rect x="51" y="197" width="300" height="112" rx="18" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="71.5" y="213.5" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="hanging">1</text>
<text x="71.5" y="238.5" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="hanging">C++ API</text>
<text x="71.5" y="273.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="hanging">initial values / defaults</text>
<rect x="449" y="197" width="300" height="112" rx="18" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="469.5" y="213.5" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="hanging">2</text>
<text x="469.5" y="238.5" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="hanging">Configuration file</text>
<text x="469.5" y="273.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="hanging">persistent named values</text>
<rect x="847" y="197" width="300" height="112" rx="18" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="867.5" y="213.5" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="hanging">3</text>
<text x="867.5" y="238.5" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="hanging">Command line</text>
<text x="867.5" y="273.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="hanging">invocation override</text>
<text x="384" y="228" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="600" text-anchor="start" dominant-baseline="hanging">→</text>
<text x="782" y="228" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="600" text-anchor="start" dominant-baseline="hanging">→</text>
<rect x="309" y="361" width="580" height="116" rx="20" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="333.5" y="377.5" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start" dominant-baseline="hanging">NAMED ENDPOINT INSTANCE</text>
<text x="333.5" y="407.5" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" dominant-baseline="hanging">server or client endpoint</text>
<text x="333.5" y="443.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="hanging">effective configuration · generated help · inspection</text>
<text x="600" y="483" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" text-anchor="start" dominant-baseline="hanging">↓</text>
<rect x="51" y="529" width="1096" height="110" rx="18" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="69.5" y="544.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start" dominant-baseline="hanging">RELEVANT SECTIONS</text>
<rect x="69.5" y="575.5" width="180" height="42" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
<text x="82.5" y="585.5" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="hanging">local / remote</text>
<rect x="265.5" y="575.5" width="170" height="42" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
<text x="278.5" y="585.5" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="hanging">connection</text>
<rect x="451.5" y="575.5" width="150" height="42" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
<text x="464.5" y="585.5" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="hanging">socket</text>
<rect x="617.5" y="575.5" width="210" height="42" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
<text x="630.5" y="585.5" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="hanging">TLS when selected</text>
<rect x="845.5" y="575.5" width="270" height="42" rx="12" fill="#F6F7F9"/>
<text x="859.5" y="586.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="hanging">Anonymous instance · API only</text>
