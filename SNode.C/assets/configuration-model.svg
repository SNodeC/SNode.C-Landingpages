<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1160" role="img" aria-labelledby="title desc">
  <title id="title">SNode.C configuration model</title>
  <desc id="desc">C++ API defaults, a configuration file, and command-line overrides form precedence steps one through three and feed one named server or client endpoint instance. That instance exposes relevant local or remote, connection, socket, and optional TLS configuration sections.</desc>
  <defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#20304a" stroke-width="1" opacity=".34"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5ca8ff"/></marker></defs>
  <rect width="900" height="1160" rx="28" fill="#0b1425"/><rect width="900" height="1160" rx="28" fill="url(#grid)"/>
  <text x="48" y="58" fill="#5ca8ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="3">CONFIGURATION MODEL</text>
  <text x="48" y="108" fill="#f5f8ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="750">One endpoint policy, three input surfaces</text>
  <text x="48" y="152" fill="#aebbd0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700">PRECEDENCE · 1 → 2 → 3</text>

  <rect x="48" y="184" width="804" height="112" rx="22" fill="#152640" stroke="#5ca8ff" stroke-width="3"/>
  <text x="78" y="230" fill="#5ca8ff" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="30" font-weight="700">1 · C++ API</text>
  <text x="78" y="270" fill="#f5f8ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700">initial values / defaults</text>

  <rect x="48" y="320" width="804" height="112" rx="22" fill="#201d3d" stroke="#b583ff" stroke-width="3"/>
  <text x="78" y="366" fill="#b583ff" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="30" font-weight="700">2 · CONFIGURATION FILE</text>
  <text x="78" y="406" fill="#f5f8ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700">persistent named values</text>

  <rect x="48" y="456" width="804" height="112" rx="22" fill="#173024" stroke="#55d86f" stroke-width="3"/>
  <text x="78" y="502" fill="#55d86f" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="30" font-weight="700">3 · COMMAND LINE</text>
  <text x="78" y="542" fill="#f5f8ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700">override for this invocation</text>

  <path d="M450 568V616" stroke="#5ca8ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="48" y="630" width="804" height="154" rx="24" fill="#152640" stroke="#38cad6" stroke-width="4"/>
  <text x="78" y="678" fill="#38cad6" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="30" font-weight="700">NAMED ENDPOINT INSTANCE</text>
  <text x="78" y="726" fill="#f5f8ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="33" font-weight="750">server or client endpoint</text>
  <text x="78" y="766" fill="#aebbd0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30">identity · enabled state · generated help / inspection</text>

  <text x="48" y="842" fill="#f0b45b" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="30" font-weight="700">RELEVANT SECTIONS</text>
  <rect x="48" y="862" width="382" height="88" rx="18" fill="#30231c" stroke="#f0b45b" stroke-width="3"/><text x="239" y="918" text-anchor="middle" fill="#f5f8ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700">local / remote</text>
  <rect x="470" y="862" width="382" height="88" rx="18" fill="#30231c" stroke="#f0b45b" stroke-width="3"/><text x="661" y="918" text-anchor="middle" fill="#f5f8ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700">connection</text>
  <rect x="48" y="972" width="382" height="88" rx="18" fill="#30231c" stroke="#f0b45b" stroke-width="3"/><text x="239" y="1028" text-anchor="middle" fill="#f5f8ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700">socket</text>
  <rect x="470" y="972" width="382" height="88" rx="18" fill="#30231c" stroke="#f0b45b" stroke-width="3"/><text x="661" y="1028" text-anchor="middle" fill="#f5f8ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700">TLS when selected</text>

  <text x="450" y="1112" text-anchor="middle" fill="#aebbd0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30">Anonymous instances use the API surface only.</text>
</svg>
