<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 675">
  <title id="title">SNode.C layered networking architecture</title>
  <desc id="desc">SNode.C layered networking architecture</desc>
  <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111b2e"/>
      </linearGradient>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#58a6ff" stop-opacity=".95"/>
        <stop offset="1" stop-color="#58a6ff" stop-opacity=".35"/>
      </linearGradient>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
      </pattern>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0 0L10 5L0 10Z" fill="#58a6ff"/>
      </marker>
      <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0 0L10 5L0 10Z" fill="#a9b8cd"/>
      </marker>
    </defs>
  <rect width="1200" height="675" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="675" rx="30" fill="url(#grid)"/>
  <path d="M0 667H1200" stroke="#58a6ff" stroke-width="8" opacity=".9"/>

  <text x="55" y="48" fill="#58a6ff" font-family="Inter,ui-sans-serif,system-ui" font-size="20" font-weight="700" letter-spacing="3">LAYER ARCHITECTURE</text>
    <text x="55" y="110" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="42" font-weight="750">Compose behavior without hiding boundaries</text>
    <text x="55" y="153" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="22">Availability does not imply that every theoretical combination is qualified.</text>
  <g>
      <rect x="80" y="205" width="1040" height="70" rx="18" fill="#14223a" stroke="#bc8cff" stroke-width="1.5"/>
      <text x="104" y="243" fill="#bc8cff" font-family="ui-monospace,monospace" font-size="24" font-weight="700">05</text>
      <text x="144" y="243" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">Application protocol</text>
      <text x="104" y="277" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">MQTT 3.1.1 · HTTP applications · Express-style routing</text>
    </g>
  <g>
      <rect x="80" y="290" width="1040" height="70" rx="18" fill="#14223a" stroke="#39c5cf" stroke-width="1.5"/>
      <text x="104" y="328" fill="#39c5cf" font-family="ui-monospace,monospace" font-size="24" font-weight="700">04</text>
      <text x="144" y="328" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">Connection and upgrade</text>
      <text x="104" y="362" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">HTTP parsing · WebSocket upgrade · connection lifecycle</text>
    </g>
  <g>
      <rect x="80" y="375" width="1040" height="70" rx="18" fill="#14223a" stroke="#56d364" stroke-width="1.5"/>
      <text x="104" y="413" fill="#56d364" font-family="ui-monospace,monospace" font-size="24" font-weight="700">03</text>
      <text x="144" y="413" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">Transport and encryption</text>
      <text x="104" y="447" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">stream transport · OpenSSL TLS where configured</text>
    </g>
  <g>
      <rect x="80" y="460" width="1040" height="70" rx="18" fill="#14223a" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="104" y="498" fill="#58a6ff" font-family="ui-monospace,monospace" font-size="24" font-weight="700">02</text>
      <text x="144" y="498" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">Network and address</text>
      <text x="104" y="532" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">IPv4 · IPv6 · Unix domain · optional Bluetooth families</text>
    </g>
  <g>
      <rect x="80" y="545" width="1040" height="70" rx="18" fill="#14223a" stroke="#e3b341" stroke-width="1.5"/>
      <text x="104" y="583" fill="#e3b341" font-family="ui-monospace,monospace" font-size="24" font-weight="700">01</text>
      <text x="144" y="583" fill="#f5f8ff" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="700">Event loop and operating system</text>
      <text x="104" y="617" fill="#a9b8cd" font-family="Inter,ui-sans-serif,system-ui" font-size="17">epoll multiplexer · timers · descriptors · signals</text>
    </g>

</svg>
