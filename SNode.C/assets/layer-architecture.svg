<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">SNode.C architecture by composition — desktop</title>
<desc id="desc">Five layers show application context, connection mode, endpoint role, address family, and event runtime. Application contexts include custom stream, HTTP/Express-style, SSE/EventSource, WebSocket, and MQTT; Bluetooth RFCOMM and L2CAP are marked source-only.</desc>
<rect x="0.5" y="0.5" width="1199" height="759" rx="24" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="51" y="37" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" dominant-baseline="hanging">ARCHITECTURE BY COMPOSITION</text>
<text x="51" y="69" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start" dominant-baseline="hanging">Keep protocol behavior above connection mechanics</text>
<text x="51" y="113" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="hanging">Choose one compatible path through each layer; qualify the concrete path you deploy.</text>
