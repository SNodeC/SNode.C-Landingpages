<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">SNode.C HTTP to WebSocket context replacement — desktop</title>
<desc id="desc">HTTP remains active while a replacement WebSocket context is prepared and staged. After the current HTTP read callback returns, the old context detaches and is removed, the active pointer changes, SocketContextUpgrade attaches, and the same SocketConnection remains established.</desc>
<rect x="0.5" y="0.5" width="1199" height="819" rx="24" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="51" y="37" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" dominant-baseline="hanging">HTTP → WEBSOCKET</text>
<text x="51" y="69" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start" dominant-baseline="hanging">Replace the context, keep the connection</text>
<text x="51" y="113" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="hanging">The replacement is staged while HTTP remains active, then committed after the read callback returns.</text>
<rect x="51" y="169" width="280" height="92" rx="18" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="69.5" y="182.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="hanging">ACTIVE BEFORE</text>
<text x="69.5" y="207.5" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="hanging">HTTP SocketContext</text>
<rect x="867" y="169" width="280" height="92" rx="16" fill="#ECFCF6" stroke="#11A474" stroke-width="1.5"/>
<text x="885.5" y="182.5" fill="#057959" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="hanging">ACTIVE AFTER</text>
<text x="885.5" y="207.5" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="hanging">SocketContextUpgrade</text>
<text x="381" y="200" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start" dominant-baseline="hanging">HTTP active  →  replacement staged  →  WebSocket active</text>
<rect x="51" y="291" width="330" height="342" rx="18" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="71.5" y="307.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="hanging">01 · PREPARE</text>
<text x="71.5" y="347.5" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="hanging">1</text>
<text x="103.5" y="346.5" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" dominant-baseline="hanging">Accepted HTTP Upgrade</text>
<text x="71.5" y="401.5" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="hanging">2</text>
<text x="103.5" y="400.5" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" dominant-baseline="hanging">WebSocket factory selected</text>
<text x="71.5" y="455.5" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="hanging">3</text>
<text x="103.5" y="454.5" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" dominant-baseline="hanging">Replacement context created</text>
<text x="71.5" y="509.5" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="hanging">4</text>
<text x="103.5" y="508.5" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" dominant-baseline="hanging">101 Switching Protocols prepared</text>
<rect x="409" y="291" width="330" height="342" rx="18" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="429.5" y="307.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="hanging">02 · STAGE</text>
<text x="429.5" y="347.5" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="hanging">5</text>
<text x="461.5" y="346.5" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" dominant-baseline="hanging">setSocketContext(new)</text>
<text x="461.5" y="370.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="hanging">stages replacement; HTTP stays active</text>
<text x="429.5" y="421.5" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="hanging">6</text>
<text x="461.5" y="420.5" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" dominant-baseline="hanging">Application/status callback</text>
<text x="461.5" y="444.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="hanging">calls response-&gt;end() · queues the 101</text>
<rect x="767" y="291" width="330" height="342" rx="18" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="787.5" y="307.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="hanging">03 · COMMIT AFTER CALLBACK</text>
<text x="787.5" y="347.5" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="hanging">7</text>
<text x="819.5" y="346.5" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start" dominant-baseline="hanging">HTTP read callback returns</text>
<text x="787.5" y="394.5" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="hanging">8</text>
<text x="819.5" y="393.5" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start" dominant-baseline="hanging">detach(ContextSwitch)</text>
<text x="787.5" y="441.5" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="hanging">9</text>
<text x="819.5" y="440.5" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start" dominant-baseline="hanging">old HTTP context removed</text>
<text x="787.5" y="488.5" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="hanging">10</text>
<text x="819.5" y="487.5" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start" dominant-baseline="hanging">active-context pointer changes</text>
<text x="787.5" y="535.5" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" dominant-baseline="hanging">11</text>
<text x="819.5" y="534.5" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start" dominant-baseline="hanging">SocketContextUpgrade::attach()</text>
<rect x="51" y="673" width="1096" height="92" rx="18" fill="#0F172A"/>
<text x="75" y="691" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" dominant-baseline="hanging">same SocketConnection remains established</text>
<text x="75" y="726" fill="#CBD5E3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start" dominant-baseline="hanging">descriptor-backed stream · addresses · connection identity retained · no second transport connection</text>
</svg>
