<svg role="img" aria-labelledby="title desc" viewBox="0 0 1200 820" fill="none" xmlns="http://www.w3.org/2000/svg">
<title id="title">SNode.C HTTP to WebSocket context replacement — desktop</title>
<desc id="desc">HTTP remains active while a replacement WebSocket context is prepared and staged. After the current HTTP read callback returns, the old context detaches and is removed, the active pointer changes, SocketContextUpgrade attaches, and the same SocketConnection remains established.</desc>
<rect x="0.5" y="0.5" width="1199" height="819" rx="23.5" fill="#F8FAFC"/>
<rect x="0.5" y="0.5" width="1199" height="819" rx="23.5" stroke="#CBD5E1"/>
<text fill="#2563EB" style="white-space: pre" xml:space="preserve" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" letter-spacing="0em"><tspan x="52" y="54.6818">HTTP &#x2192; WEBSOCKET</tspan></text>
<text fill="#0F172A" style="white-space: pre" xml:space="preserve" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" letter-spacing="0em"><tspan x="52" y="101.136">Replace the context, keep the connection</tspan></text>
<text fill="#475569" style="white-space: pre" xml:space="preserve" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" letter-spacing="0em"><tspan x="52" y="131.545">The replacement is staged while HTTP remains active, then committed after the read callback returns.</tspan></text>
