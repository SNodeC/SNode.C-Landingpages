ish</tspan></text><path d="M486 292H134C124.059 292 116 300.059 116 310V412C116 421.941 124.059 430 134 430H486C495.941 430 504 421.941 504 412V310C504 300.059 495.941 292 486 292Z" fill="#11231C" stroke="#2D6049" stroke-width="1.5"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold" letter-spacing="0em"><tspan x="144" y="330.545">MQTTBroker</tspan></text><text fill="#90A99F" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="bold" letter-spacing="0em"><tspan x="144" y="356.455">configured broker A &#xb7; same broker anchor</tspan></text><text fill="#90A99F" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="0em"><tspan x="144" y="386.455">accepts clients &#xb7; distributes publications</tspan></text><text fill="#90A99F" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="0em"><tspan x="144" y="407.455">optional shared mapper in process</tspan></text><path d="M473 309H385C380.029 309 376 313.029 376 318V325C376 329.971 380.029 334 385 334H473C477.971 334 482 329.971 482 325V318C482 313.029 477.971 309 473 309Z" fill="#163627"/><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="0em"><tspan x="393" y="328.455">MQTT 3.1.1</tspan></text><path d="M282 468H60C52.268 468 46 474.268 46 482V542C46 549.732 52.268 556 60 556H282C289.732 556 296 549.732 296 542V482C296 474.268 289.732 468 282 468Z" fill="#0B1713" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold" letter-spacing="0em"><tspan x="66" y="500.545">MQTTCli</tspan></text><text fill="#90A99F" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="0em"><tspan x="66" y="530.455">publish &#xb7; subscribe &#xb7; inspect</tspan></text><path d="M296 510H358C378 510 396 475 396 430" stroke="#70D4A1" stroke-width="2"/><path d="M560 580H338C330.268 580 324 586.268 324 594V692C324 699.732 330.268 706 338 706H560C567.732 706 574 699.732 574 692V594C574 586.268 567.732 580 560 580Z" fill="#0B1713" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold" letter-spacing="0em"><tspan x="344" y="613.545">MQTTIntegrator</tspan></text><text fill="#90A99F" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="0em"><tspan x="344" y="643.455">subscribed publication</tspan></text><text fill="#90A99F" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="0em"><tspan x="344" y="668.455">map &#x2192; republish</tspan></text><text fill="#90A99F" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="0em"><tspan x="344" y="691.455">same outbound client connection</tspan></text><path d="M436 430C436 492 451 527 451 580" stroke="#70D4A1" stroke-width="2"/><path d="M407 580C372 547 365 487 365 430" stroke="#71867D" stroke-width="1.7" stroke-dasharray="5 5"/><path d="M560 738H60C52.268 738 46 744.268 46 752V866C46 873.732 52.268 880 60 880H560C567.732 880 574 873.732 574 866V752C574 744.268 567.732 738 560 738Z" fill="#0B1713" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold" letter-spacing="0em"><tspan x="66" y="772.545">MQTTBridge</tspan></text><text fill="#90A99F" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-