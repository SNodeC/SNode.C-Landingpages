<svg width="620" height="1170" viewBox="0 0 620 1170" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="620" height="1170" rx="24" fill="#090E0D"/><text fill="#F1F7F4" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="bold"><tspan x="28" y="52.0909">Subscribe, match, map, republish</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="13"><tspan x="28" y="78.7273">Subscription QoS and mapped-output QoS are independent; immediate and delayed </tspan><tspan x="28" y="94.7273">outputs share the same MQTT client</tspan></text><circle cx="32" cy="1110" r="4" fill="#56D697"/><text fill="#A6C7B8" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="46" y="1116.5">Source-verified current behavior &#xb7; not separately runtime-exercised</tspan></text><rect x="34.6" y="155.6" width="550.8" height="83.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="155.6" width="550.8" height="83.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="189.545">Broker</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="210.864">input publication</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="292" y="260.545">&#x2193;</tspan></text><rect x="34.6" y="280.6" width="550.8" height="118.8" rx="15.4" fill="#10221A"/><rect x="34.6" y="280.6" width="550.8" height="118.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" f