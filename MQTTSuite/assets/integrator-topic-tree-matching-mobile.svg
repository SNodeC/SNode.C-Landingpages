<svg width="620" height="1170" viewBox="0 0 620 1170" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="620" height="1170" rx="24" fill="#090E0D"/><text fill="#F1F7F4" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="bold"><tspan x="28" y="52.0909">Topic tree: literals first, then broader fallbacks</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="13"><tspan x="28" y="78.7273">+ matches exactly one level; terminal # matches zero or more; sibling arrays are first-match </tspan><tspan x="28" y="94.7273">in document order</tspan></text><circle cx="32" cy="1110" r="4" fill="#56D697"/><text fill="#A6C7B8" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="46" y="1116.5">Source-verified current behavior &#xb7; not separately runtime-exercised</tspan></text><rect x="34.6" y="155.6" width="550.8" height="83.8" rx="15.4" fill="#10221A"/><rect x="34.6" y="155.6" width="550.8" height="83.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="189.545">devices</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="210.864">root topic level</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="292" y="260.545">&#x2193;</tspan></text><rect x="34.6" y="280.6" width="550.8" height="93.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="280.6" width="550.8" height="93.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="314.545">1 &#xb7; temperature</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="335.864">literal branch &#xb7; most specific</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="292" y="396.545">&#x2193;</tspan></text><rect x="34.6" y="416.6" width="550.8" height="93.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="416.6" width="550.8" height="93.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="450.545">2 &#xb7; +</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="471.864">matches exactly one level</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="292" y="532.545">&#x2193;</tspan></text><rect x="34.6" y="552.6" width="550.8" height="93.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="552.6" width="550.8" height="93.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="586.545">3 &#xb7; #</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="607.864">terminal &#xb7; matches zero or more remaining levels</tspan></text><rect x="60.5" y="680.5" width="499" height="29" rx="8.5" fill="#10221A"/><rect x="60.5" y="680.5" width="499" height="29" rx="8.5" stroke="#203D31"/><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="171.941" y="696.5">first matching sibling wins &#xb7; order is part of behavior</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11"><tspan x="34" y="750.5">Zero-level # case</tspan></text><rect x="34.6" y="775.6" width="550.8" height="98.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="775.6" width="550.8" height="98.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="809.545">parent/#</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="830.864">can match parent when parent has no own subscription</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11"><tspan x="34" y="915.5">Examples: devices &#xb7; devices/x &#xb7; devices/x/y</tspan></text></svg>