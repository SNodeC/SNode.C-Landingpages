<svg width="620" height="1030" viewBox="0 0 620 1030" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="620" height="1030" rx="24" fill="#090E0D"/><text fill="#F1F7F4" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="bold"><tspan x="28" y="52.0909">Mapping can run inside MQTTBroker</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16"><tspan x="28" y="81.3182">Incoming publications follow normal broker routing and may also produce </tspan><tspan x="28" y="100.318">mapped publications that re-enter the same Broker</tspan></text><circle cx="32" cy="970" r="4" fill="#56D697"/><text fill="#A6C7B8" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600"><tspan x="46" y="981.318">Source-verified current behavior &#xb7; not separately runtime-exercised</tspan></text><rect x="34.6" y="160.6" width="550.8" height="103.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="160.6" width="550.8" height="103.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="194.545">Incoming PUBLISH</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16"><tspan x="52" y="219.318">topic &#xb7; payload &#xb7; QoS &#xb7; retain</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="292" y="285.545">&#x2193;</tspan></text><rect x="34.6" y="306.6" width="550.8" height="158.8" rx="15.4" fill="#10221A"/><rect x="34.6" y="306.6" width="550.8" height="158.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="340.545">MQTTBroker</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16"><tspan x="52" y="365.318">normal broker routing</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16"><tspan x="52" y="389.318">optional shared MqttMapper</tspan></text><rect x="34.6" y="540.6" width="264.8" height="108.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="540.6" width="264.8" height="108.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="574.545">Normal subscribers</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16"><tspan x="52" y="599.318">original publication</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16"><tspan x="320" y="525.318">Mapper side path</tspan></text><rect x="320.6" y="540.6" width="264.8" height="108.8" rx="15.4" fill="#0B1713"/><rect x="320.6" y="540.6" width="264.8" height="108.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="338" y="574.545">Mapped publish</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16"><tspan x="338" y="599.318">immediate or delayed &#xb7; re-</tspan><tspan x="338" y="618.318">enters same Broker</tspan></text><rect x="135.5" y="690.5" width="349" height="29" rx="8.5" fill="#10221A"/><rect x="135.5" y="690.5" width="349" height="29" rx="8.5" stroke="#203D31"/><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600"><tspan x="182.32" y="711.318">same process &#xb7; same Broker core</tspan></text><rect x="309" y="466" width="2" height="40" rx="1" fill="#56D697"/><rect x="167" y="504" width="286" height="2" rx="1" fill="#56D697"/><rect x="167" y="504" width="2" height="26" rx="1" fill="#56D697"/><rect x="453" y="504" width="2" height="26" rx="1" fill="#56D697"/><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="158" y="535.545">&#x2193;</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="444" y="535.545">&#x2193;</tspan></text></svg>