<svg width="620" height="1030" viewBox="0 0 620 1030" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="620" height="1030" rx="24" fill="#090E0D"/><text fill="#F1F7F4" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="bold"><tspan x="28" y="52.0909">Mapping can run inside MQTTBroker</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="13"><tspan x="28" y="78.7273">Incoming publications follow normal broker routing and may also produce mapped </tspan><tspan x="28" y="94.7273">publications that re-enter the same Broker</tspan></text><circle cx="32" cy="970" r="4" fill="#56D697"/><text fill="#A6C7B8" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="46" y="976.5">Source-verified current behavior &#xb7; not separately runtime-exercised</tspan></text><rect x="34.6" y="160.6" width="550.8" height="103.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="160.6" width="550.8" height="103.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="194.545">Incoming PUBLISH</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="215.864">topic &#xb7; payload &#xb7; QoS &#xb7; retain</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="292" y="285.545">&#x2193;</tspan></text><rect x="34.6" y="306.6" width="550.8" height="158.8" rx="15.4" fill="#10221A"/><rect x="34.6" y="306.6" width="550.8" height="158.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="340.545">MQTTBroker</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="361.864">normal broker routing</tspan><tspan x="52" y="381.864">optional shared MqttMapper</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="292" y="487.545">&#x2193;</tspan></text><rect x="34.6" y="510.6" width="550.8" height="98.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="510.6" width="550.8" height="98.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="544.545">Normal subscribers</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="565.864">original publication</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11"><tspan x="34" y="645.5">Mapper side path</tspan></text><rect x="34.6" y="670.6" width="550.8" height="103.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="670.6" width="550.8" height="103.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="704.545">Mapped publish</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="725.864">immediate or delayed &#xb7; re-enters same Broker</tspan></text><rect x="135.5" y="806.5" width="349" height="29" rx="8.5" fill="#10221A"/><rect x="135.5" y="806.5" width="349" height="29" rx="8.5" stroke="#203D31"/><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="222.22" y="822.5">same process &#xb7; same Broker core</tspan></text></svg>