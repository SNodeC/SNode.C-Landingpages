<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="800" rx="24" fill="#090E0D"/><text fill="#F1F7F4" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="bold"><tspan x="40" y="64.9091">Topic tree: literals first, then broader fallbacks</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="15"><tspan x="40" y="94.4545">+ matches exactly one level; terminal # matches zero or more; sibling arrays are first-match in document order</tspan></text><circle cx="44" cy="748" r="4" fill="#56D697"/><text fill="#A6C7B8" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600"><tspan x="58" y="755.864">Source-verified current behavior &#xb7; not separately runtime-exercised</tspan></text><rect x="65.6" y="185.6" width="218.8" height="93.8" rx="15.4" fill="#10221A"/><rect x="65.6" y="185.6" width="218.8" height="93.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="83" y="219.545">devices</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="83" y="240.864">root topic level</tspan></text><rect x="175" y="280" width="2" height="70" rx="1" fill="#56D697"/><rect x="175" y="348" width="740" height="2" rx="1" fill="#56D697"/><rect x="350.6" y="390.6" width="218.8" height="103.8" rx="15.4" fill="#0B1713"/><rect x="350.6" y="390.6" width="218.8" height="103.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="368" y="424.545">temperature</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="368" y="445.864">literal &#xb7; most specific</tspan><tspan x="368" y="465.864">subscription.qos = 1</tspan></text><rect x="620.6" y="390.6" width="218.8" height="103.8" rx="15.4" fill="#0B1713"/><rect x="620.6" y="390.6" width="218.8" height="103.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="638" y="424.545">+</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="638" y="445.864">one topic level</tspan><tspan x="638" y="465.864">fallback</tspan></text><rect x="890.6" y="390.6" width="218.8" height="103.8" rx="15.4" fill="#0B1713"/><rect x="890.6" y="390.6" width="218.8" height="103.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="908" y="424.545">#</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="908" y="445.864">terminal multi-level</tspan><tspan x="908" y="465.864">zero or more levels</tspan></text><rect x="460" y="350" width="2" height="40" rx="1" fill="#56D697"/><rect x="730" y="350" width="2" height="40" rx="1" fill="#56D697"/><rect x="1000" y="350" width="2" height="40" rx="1" fill="#56D697"/><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11"><tspan x="348" y="535.5">1 &#xb7; literal checked first</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11"><tspan x="618" y="535.5">2 &#xb7; + fallback</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11"><tspan x="888" y="535.5">3 &#xb7; # broadest fallback</tspan></text><rect x="300.5" y="585.5" width="599" height="29" rx="8.5" fill="#241C0D"/><rect x="300.5" y="585.5" width="599" height="29" rx="8.5" stroke="#203D31"/><text fill="#E2B66B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="406.125" y="601.5">parent/# also matches parent itself when parent has no own subscription</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11"><tspan x="70" y="665.5">Example topics</tspan></text><rect x="70.5" y="690.5" width="249" height="29" rx="8.5" fill="#10221A"/><rect x="70.5" y="690.5" width="249" height="29" rx="8.5" stroke="#203D31"/><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="139.232" y="706.5">devices/temperature</tspan></text><rect x="345.5" y="690.5" width="249" height="29" rx="8.5" fill="#10221A"/><rect x="345.5" y="690.5" width="249" height="29" rx="8.5" stroke="#203D31"/><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="424.663" y="706.5">devices/room-01</tspan></text><rect x="620.5" y="690.5" width="309" height="29" rx="8.5" fill="#10221A"/><rect x="620.5" y="690.5" width="309" height="29" rx="8.5" stroke="#203D31"/><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="693.214" y="706.5">devices/room-01/sensor/value</tspan></text></svg>