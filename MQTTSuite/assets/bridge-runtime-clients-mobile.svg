<svg width="620" height="1120" viewBox="0 0 620 1120" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="620" height="1120" rx="24" fill="#090E0D"/><text fill="#F1F7F4" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="bold"><tspan x="28" y="52.0909">Definition becomes outbound MQTT clients</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16"><tspan x="28" y="81.3182">BridgeStore validates/defaults JSON, creates logical bridges and broker </tspan><tspan x="28" y="100.318">members, then runtime transport selection creates SNode.C clients</tspan></text><circle cx="32" cy="1060" r="4" fill="#56D697"/><text fill="#A6C7B8" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600"><tspan x="46" y="1071.32">Source-verified current behavior &#xb7; not separately runtime-exercised</tspan></text><rect x="34.6" y="155.6" width="550.8" height="88.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="155.6" width="550.8" height="88.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="189.545">bridge.json</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16"><tspan x="52" y="214.318">bridges[] &#xb7; brokers[]</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="292" y="265.545">&#x2193;</tspan></text><rect x="34.6" y="286.6" width="550.8" height="128.8" rx="15.4" fill="#10221A"/><rect x="34.6" y="286.6" width="550.8" height="128.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="320.545">Schema + BridgeStore</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16"><tspan x="52" y="345.318">validate &#xb7; apply defaults &#xb7; activate staged</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="292" y="437.545">&#x2193;</tspan></text><rect x="34.6" y="458.6" width="550.8" height="148.8" rx="15.4" fill="#10221A"/><rect x="34.6" y="458.6" width="550.8" height="148.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="492.545">Logical Bridge</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16"><tspan x="52" y="517.318">name &#xb7; prefix &#xb7; disabled</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16"><tspan x="52" y="541.318">broker member objects &#xb7; bridge+instance names</tspan></text><rect x="34.6" y="670.6" width="264.8" height="108.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="670.6" width="264.8" height="108.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="704.545">Outbound SNode.C client </tspan><tspan x="52" y="726.545">A</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16"><tspan x="52" y="751.318">stream / WebSocket &#xb7; MQTT </tspan><tspan x="52" y="770.318">context</tspan></text><rect x="320.6" y="670.6" width="264.8" height="108.8" rx="15.4" fill="#0B1713"/><rect x="320.6" y="670.6" width="264.8" height="108.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="338" y="704.545">Outbound SNode.C client </tspan><tspan x="338" y="726.545">B</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16"><tspan x="338" y="751.318">stream / WebSocket &#xb7; MQTT </tspan><tspan x="338" y="770.318">context</tspan></text><rect x="95.5" y="820.5" width="429" height="29" rx="8.5" fill="#10221A"/><rect x="95.5" y="820.5" width="429" height="29" rx="8.5" stroke="#203D31"/><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600"><tspan x="130.93" y="841.318">one runtime client per enabled broker member</tspan></text><rect x="309" y="608" width="2" height="30" rx="1" fill="#56D697"/><rect x="167" y="636" width="286" height="2" rx="1" fill="#56D697"/><rect x="167" y="636" width="2" height="24" rx="1" fill="#56D697"/><rect x="453" y="636" width="2" height="24" rx="1" fill="#56D697"/><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="158" y="665.545">&#x2193;</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="444" y="665.545">&#x2193;</tspan></text></svg>