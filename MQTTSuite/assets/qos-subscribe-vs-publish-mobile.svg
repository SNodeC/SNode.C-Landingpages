<svg width="620" height="1060" viewBox="0 0 620 1060" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="620" height="1060" rx="24" fill="#090E0D"/>
<text fill="#F1F7F4" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="bold"><tspan x="28" y="52.0909">Subscription QoS is not publish QoS</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="13"><tspan x="28" y="78.7273">Requested delivery limit and outgoing PUBLISH QoS are independent decisions</tspan></text><circle cx="32" cy="1000" r="4" fill="#56D697"/><text fill="#A6C7B8" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="46" y="1006.5">Source-verified current behavior &#xb7; not separately runtime-exercised</tspan></text>
<text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11"><tspan x="34" y="165.5">SUBSCRIBE</tspan></text><rect x="34.6" y="188.6" width="550.8" height="108.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="188.6" width="550.8" height="108.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="223.545">sensors/+/temperature##1</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="244.864">requested delivery QoS = 1</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="292" y="319.545">&#x2193;</tspan></text><rect x="34.6" y="340.6" width="550.8" height="88.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="340.6" width="550.8" height="88.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="375.545">Broker delivery</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="396.864">bounded by subscription request</tspan></text>
<text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11"><tspan x="34" y="478.5">PUBLISH</tspan></text><rect x="34.6" y="500.6" width="550.8" height="103.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="500.6" width="550.8" height="103.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="535.545">demo/value##2</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="556.864">outgoing PUBLISH QoS = 2</tspan></text>
<text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11"><tspan x="34" y="660.5">Integrator uses two fields</tspan></text><rect x="34.6" y="685.6" width="264.8" height="88.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="685.6" width="264.8" height="88.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="720.545">subscription.qos</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="741.864">receive side = 1</tspan></text><rect x="320.6" y="685.6" width="264.8" height="88.8" rx="15.4" fill="#0B1713"/><rect x="320.6" y="685.6" width="264.8" height="88.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="338" y="720.545">output qos</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="338" y="741.864">publish side = 0</tspan></text><rect x="120.5" y="810.5" width="379" height="29" rx="8.5" fill="#10221A"/><rect x="120.5" y="810.5" width="379" height="29" rx="8.5" stroke="#203D31"/><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="174.831" y="826.5">subscribe QoS never silently becomes publish QoS</tspan></text>
</svg>
