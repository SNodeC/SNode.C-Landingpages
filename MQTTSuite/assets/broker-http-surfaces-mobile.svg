<svg width="620" height="1110" viewBox="0 0 620 1110" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="620" height="1110" rx="24" fill="#090E0D"/><text fill="#F1F7F4" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="bold"><tspan x="28" y="52.0909">One HTTP router, four distinct surfaces</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="13"><tspan x="28" y="78.7273">Static dashboard, live SSE, mutating JSON operations, and MQTT-over-WebSocket are </tspan><tspan x="28" y="94.7273">different contracts</tspan></text><circle cx="32" cy="1050" r="4" fill="#56D697"/><text fill="#A6C7B8" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="46" y="1056.5">Source-verified current behavior &#xb7; not separately runtime-exercised</tspan></text><rect x="34.6" y="160.6" width="550.8" height="123.8" rx="15.4" fill="#10221A"/><rect x="34.6" y="160.6" width="550.8" height="123.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="194.545">Broker HTTP router</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="215.864">in-http / in-https &#xb7; shared route tree</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="292" y="307.545">&#x2193;</tspan></text><rect x="34.6" y="330.6" width="550.8" height="93.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="330.6" width="550.8" height="93.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="364.545">Dashboard</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="385.864">/clients &#xb7; static application</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="292" y="445.545">&#x2193;</tspan></text><rect x="34.6" y="468.6" width="550.8" height="93.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="468.6" width="550.8" height="93.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="502.545">SSE live state</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="523.864">/api/mqtt/events &#xb7; /sse</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="292" y="583.545">&#x2193;</tspan></text><rect x="34.6" y="606.6" width="550.8" height="103.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="606.6" width="550.8" height="103.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="640.545">Operational JSON API</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="661.864">POST disconnect &#xb7; subscribe &#xb7; unsubscribe &#xb7; release</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="292" y="731.545">&#x2193;</tspan></text><rect x="34.6" y="754.6" width="550.8" height="93.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="754.6" width="550.8" height="93.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="788.545">MQTT WebSocket</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="809.864">/ws &#xb7; /mqtt &#xb7; / &#xb7; subprotocol mqtt</tspan></text><rect x="118.5" y="872.5" width="383" height="29" rx="8.5" fill="#241C0D"/><rect x="118.5" y="872.5" width="383" height="29" rx="8.5" stroke="#203D31"/><text fill="#E2B66B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="185.203" y="888.5">separate contracts on one HTTP listener family</tspan></text></svg>