<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="800" rx="24" fill="#090E0D"/><text fill="#F1F7F4" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="bold"><tspan x="40" y="64.9091">Three mapping modes, one output model</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="15"><tspan x="40" y="94.4545">All modes produce ordinary MQTT PUBLISH results; arrays fan one input out to multiple independently configured outputs</tspan></text><circle cx="44" cy="748" r="4" fill="#56D697"/><text fill="#A6C7B8" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600"><tspan x="58" y="755.864">Source-verified current behavior &#xb7; not separately runtime-exercised</tspan></text><rect x="50.6" y="290.6" width="218.8" height="113.8" rx="15.4" fill="#0B1713"/><rect x="50.6" y="290.6" width="218.8" height="113.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="68" y="324.545">Input PUBLISH</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="68" y="345.864">topic + payload</tspan></text><rect x="365.6" y="180.6" width="228.8" height="148.8" rx="15.4" fill="#10221A"/><rect x="365.6" y="180.6" width="228.8" height="148.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="383" y="214.545">static</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><t