<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="800" rx="24" fill="#090E0D"/><text fill="#F1F7F4" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="30" font-weight="bold"><tspan x="40" y="64.9091">MQTTBridge: separate data and operator planes</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="15"><tspan x="40" y="94.4545">Bridge configuration is secret-bearing and PATCH can restart outbound clients</tspan></text><circle cx="44" cy="748" r="4" fill="#56D697"/><text fill="#A6C7B8" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" font-weight="600"><tspan x="58" y="755.864">Source-verified current behavior · not separately runtime-exercised</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="11"><tspan x="55" y="170.5">MQTT DATA PLANE</tspan></text><rect x="55.6" y="200.6" width="298.8" height="148.8" rx="15.4" fill="#10221A"/><rect x="55.6" y="200.6" width="298.8" height="148.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="18" font-weight="bold"><tspan x="73" y="234.545">Outbound MQTT clients</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12"><tspan x="73" y="255.864">MQTT 3.1.1 traffic</tspan><tspan x="73" y="275.864">broker/session/message path</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="11"><tspan x="845" y="170.5">OPERATOR / CONTROL PLANE</tspan></text><rect x="845.6" y="200.6" width="298.8" height="208.8" rx="15.4" fill="#0B1713"/><rect x="845.6" y="200.6" width="298.8" height="208.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="18" font-weight="bold"><tspan x="863" y="234.545">HTTP / HTTPS administration</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12"><tspan x="863" y="255.864">config read/patch + SSE</tspan><tspan x="863" y="275.864">no authentication middleware</tspan></text><rect x="355" y="275" width="150" height="2" rx="1" fill="#56D697"/><rect x="505.6" y="225.6" width="188.8" height="103.8" rx="15.4" fill="#0B1713"/><rect x="505.6" y="225.6" width="188.8" height="103.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="18" font-weight="bold"><tspan x="523" y="259.545">Application core</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12"><tspan x="523" y="280.864">shared state</tspan></text><rect x="695" y="275" width="150" height="2" rx="1" fill="#E2B66B"/><rect x="430.5" y="390.5" width="339" height="29" rx="8.5" fill="#241C0D"/><rect x="430.5" y="390.5" width="339" height="29" rx="8.5" stroke="#203D31"/><text fill="#E2B66B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="11" font-weight="600"><tspan x="469.155" y="406.5">TLS protects transport · authorization is separate</tspan></text><rect x="830.5" y="445.5" width="314" height="29" rx="8.5" fill="#281310"/><rect x="830.5" y="445.5" width="314" height="29" rx="8.5" stroke="#203D31"/><text fill="#E9897B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="11" font-weight="600"><tspan x="909.898" y="461.5">no application authentication</tspan></text><rect x="830.5" y="490.5" width="314" height="29" rx="8.5" fill="#241C0D"/><rect x="830.5" y="490.5" width="314" height="29" rx="8.5" stroke="#203D31"/><text fill="#E2B66B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="11" font-weight="600"><tspan x="919.454" y="506.5">GET returns full definition</tspan></text><rect x="830.5" y="535.5" width="314" height="29" rx="8.5" fill="#281310"/><rect x="830.5" y="535.5" width="314" height="29" rx="8.5" stroke="#203D31"/><text fill="#E9897B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="11" font-weight="600"><tspan x="899.543" y="551.5">PATCH mutates + restarts clients</tspan></text><rect x="415.6" y="595.6" width="368.8" height="88.8" rx="15.4" fill="#0B1713"/><rect x="415.6" y="595.6" width="368.8" height="88.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="18" font-weight="bold"><tspan x="433" y="629.545">Trusted deployment boundary</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12"><tspan x="433" y="650.864">private binding · firewall · authenticated reverse proxy</tspan></text></svg>