<svg width="620" height="1030" viewBox="0 0 620 1030" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="620" height="1030" rx="24" fill="#090E0D"/><text fill="#F1F7F4" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="bold"><tspan x="28" y="52.0909">Raw envelope first, projections second</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16"><tspan x="28" y="81.3182">Every publish is stored raw; valid JSON may additionally feed typed </tspan><tspan x="28" y="100.318">projection inserts</tspan></text><circle cx="32" cy="970" r="4" fill="#56D697"/><text fill="#A6C7B8" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600"><tspan x="46" y="981.318">Source-verified current behavior &#xb7; not separately runtime-exercised</tspan></text><rect x="34.6" y="160.6" width="550.8" height="108.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="160.6" width="550.8" height="108.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="195.545">MQTT PUBLISH</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16"><tspan x="52" y="220.318">topic &#xb7; payload &#xb7; QoS &#xb7; retain &#xb7; dup</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="292" y="292.545">&#x2193;</tspan></text><rect x="34.6" y="315.6" width="550.8" height="163.8" rx="15.4" fill="#10221A"/><rect x="34.6" y="315.6" width="550.8" height="163.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="350.545">Raw MQTT row &#xb7; always</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16"><tspan x="52" y="375.318">original payload bytes preserved</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16"><tspan x="52" y="399.318">payload_format = json | text | binary</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16"><tspan x="198" y="515.318">if payload is valid JSON</tspan></text><rect x="34.6" y="590.6" width="264.8" height="123.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="590.6" width="264.8" height="123.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="625.545">Projection A</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16"><tspan x="52" y="650.318">topic match &#xb7; extract typed </tspan><tspan x="52" y="669.318">columns</tspan></text><rect x="320.6" y="590.6" width="264.8" height="123.8" rx="15.4" fill="#0B1713"/><rect x="320.6" y="590.6" width="264.8" height="123.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="338" y="625.545">Projection B</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16"><tspan x="338" y="650.318">independent optional insert</tspan></text><g clip-path="url(#clip0_39_181)"><rect x="122" y="760" width="376" height="30" rx="9" fill="#10221A"/><text fill="#A6C7B8" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600"><tspan x="143.859" y="781.318">raw storage does not depend on projection </tspan><tspan x="277.984" y="800.318">success</tspan></text></g><rect x="122.5" y="760.5" width="375" height="29" rx="8.5" stroke="#203D31"/><rect x="309" y="515" width="2" height="42" rx="1" fill="#56D697"/><rect x="167" y="555" width="286" height="2" rx="1" fill="#56D697"/><rect x="167" y="555" width="2" height="25" rx="1" fill="#56D697"/><rect x="453" y="555" width="2" height="25" rx="1" fill="#56D697"/><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="158" y="582.545">&#x2193;</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="444" y="582.545">&#x2193;</tspan></text><defs><clipPath id="clip0_39_181"><rect x="122" y="760" width="376" height="30" rx="9" fill="white"/></clipPath></defs></svg>