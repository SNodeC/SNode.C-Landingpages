<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="1200" height="800" rx="24" fill="#090E0D"/>
<text fill="#F1F7F4" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="30" font-weight="bold" letter-spacing="0em"><tspan x="40" y="64.9091">Three different loop boundaries</tspan></text>
<text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="15" letter-spacing="0em"><tspan x="40" y="94.4545">Immediate source exclusion is local; topology/subscription design is the general control; loop_prevention is a private cooperating-endpoint mechanism</tspan></text>
<circle cx="44" cy="748" r="4" fill="#56D697"/>
<text fill="#A6C7B8" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" font-weight="600" letter-spacing="0em"><tspan x="58" y="755.864">Source-verified current behavior &#xb7; not separately runtime-exercised</tspan></text>
<rect x="55.6" y="185.6" width="298.8" height="143.8" rx="15.4" fill="#10221A"/>
<rect x="55.6" y="185.6" width="298.8" height="143.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/>
<text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="18" font-weight="bold" letter-spacing="0em"><tspan x="73" y="219.545">1 &#xb7; Immediate source </tspan><tspan x="73" y="241.545">exclusion</tspan></text>
<text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="73" y="262.864">A-delivered message is not sent</tspan></text>
<text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="73" y="282.864">straight back through A member</tspan></text>
<rect x="85.5" y="360.5" width="239" height="29" rx="8.5" fill="#10221A"/>
<rect x="85.5" y="360.5" width="239" height="29" rx="8.5" stroke="#203D31"/>
<text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="11" font-weight="600" letter-spacing="0em"><tspan x="137.442" y="376.5">prevents A &#x2192; A reflection</tspan></text>
<rect x="450.6" y="185.6" width="298.8" height="178.8" rx="15.4" fill="#10221A"/>
<rect x="450.6" y="185.6" width="298.8" height="178.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/>
<text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="18" font-weight="bold" letter-spacing="0em"><tspan x="468" y="219.545">2 &#xb7; Topology / subscriptions</tspan></text>
<text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="468" y="240.864">non-overlapping input filters</tspan></text>
<text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="468" y="260.864">prefix design</tspan></text>
<text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="468" y="280.864">avoid B receiving what A forwarded</tspan></text>
<rect x="490.5" y="390.5" width="219" height="29" rx="8.5" fill="#10221A"/>
<rect x="490.5" y="390.5" width="219" height="29" rx="8.5" stroke="#203D31"/>
<text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="11" font-weight="600" letter-spacing="0em"><tspan x="534.134" y="406.5">general loop-control tool</tspan></text>
<rect x="845.6" y="185.6" width="298.8" height="178.8" rx="15.4" fill="#10221A"/>
<rect x="845.6" y="185.6" width="298.8" height="178.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/>
<text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="18" font-weight="bold" letter-spacing="0em"><tspan x="863" y="219.545">3 &#xb7; loop_prevention</tspan></text>
<text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="863" y="240.864">private SNode.C CONNECT behavior</tspan></text>
<text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="863" y="260.864">requires cooperating endpoint</tspan></text>
<text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="863" y="280.864">not MQTT 3.1.1 standard</tspan></text>
<rect x="885.5" y="390.5" width="219" height="29" rx="8.5" fill="#241C0D"/>
<rect x="885.5" y="390.5" width="219" height="29" rx="8.5" stroke="#203D31"/>
<text fill="#E2B66B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="11" font-weight="600" letter-spacing="0em"><tspan x="939.296" y="406.5">bounded mechanism</tspan></text>
<text fill="#E9897B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="11" letter-spacing="0em"><tspan x="70" y="510.5">Cycle still possible</tspan></text>
<rect x="70.6" y="535.6" width="408.8" height="118.8" rx="15.4" fill="#281310"/>
<rect x="70.6" y="535.6" width="408.8" height="118.8" rx="15.4" stroke="#E9897B" stroke-width="1.2"/>
<text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="18" font-weight="bold" letter-spacing="0em"><tspan x="88" y="569.545">A &#x2192; Bridge &#x2192; B &#x2192; Bridge &#x2192; A</tspan></text>
<text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="88" y="590.864">if B subscribes/receives the forwarded topic</tspan></text>
<rect x="480" y="595" width="110" height="2" rx="1" fill="#E9897B"/>
<text fill="#E9897B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="18" font-weight="bold" letter-spacing="0em"><tspan x="566" y="601.545">&#x2192;</tspan></text>
<rect x="590.6" y="535.6" width="498.8" height="118.8" rx="15.4" fill="#0B1713"/>
<rect x="590.6" y="535.6" width="498.8" height="118.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/>
<text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="18" font-weight="bold" letter-spacing="0em"><tspan x="608" y="569.545">Operator must reason about the topology</tspan></text>
<text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="12" letter-spacing="0em"><tspan x="608" y="590.864">source exclusion alone does not prove arbitrary cycles safe</tspan></text>
</svg>
