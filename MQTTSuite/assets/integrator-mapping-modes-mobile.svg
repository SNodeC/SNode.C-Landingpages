<svg width="620" height="1130" viewBox="0 0 620 1130" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="620" height="1130" rx="24" fill="#090E0D"/><text fill="#F1F7F4" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="bold"><tspan x="28" y="52.0909">Three mapping modes, one output model</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="13"><tspan x="28" y="78.7273">All modes produce ordinary MQTT PUBLISH results; arrays fan one input out to multiple </tspan><tspan x="28" y="94.7273">independently configured outputs</tspan></text><circle cx="32" cy="1070" r="4" fill="#56D697"/><text fill="#A6C7B8" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="46" y="1076.5">Source-verified current behavior &#xb7; not separately runtime-exercised</tspan></text><rect x="34.6" y="155.6" width="550.8" height="88.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="155.6" width="550.8" height="88.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="189.545">Input PUBLISH</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="210.864">topic + payload</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11"><tspan x="34" y="285.5">Choose mapping mode</tspan></text><rect x="34.6" y="310.6" width="550.8" height="103.8" rx="15.4" fill="#10221A"/><rect x="34.6" y="310.6" width="550.8" height="103.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="344.545">static</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="365.864">exact input strings &#x2192; exact mapped strings</tspan></text><rect x="34.6" y="440.6" width="550.8" height="103.8" rx="15.4" fill="#10221A"/><rect x="34.6" y="440.6" width="550.8" height="103.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="474.545">value</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="495.864">whole payload exposed as scalar message</tspan></text><rect x="34.6" y="570.6" width="550.8" height="103.8" rx="15.4" fill="#10221A"/><rect x="34.6" y="570.6" width="550.8" height="103.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="604.545">json</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="625.864">parsed JSON exposed as message</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="292" y="697.545">&#x2193;</tspan></text><rect x="34.6" y="718.6" width="550.8" height="103.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="718.6" width="550.8" height="103.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="752.545">Mapped PUBLISH</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="773.864">rendered topic + payload &#xb7; output QoS &#xb7; retain</tspan></text><rect x="100.5" y="855.5" width="419" height="29" rx="8.5" fill="#10221A"/><rect x="100.5" y="855.5" width="419" height="29" rx="8.5" stroke="#203D31"/><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="170.905" y="871.5">mapping arrays fan one input out to multiple outputs</tspan></text></svg>