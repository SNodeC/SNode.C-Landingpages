dth="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="624.545">Broker B topic</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="645.864">bridge/from-a/to-b/a/temperature</tspan></text><rect x="88.5" y="745.5" width="443" height="29" rx="8.5" fill="#10221A"/><rect x="88.5" y="745.5" width="443" height="29" rx="8.5" stroke="#203D31"/><text fill="#A6C7B8" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="225.298" y="761.5">payload &#xb7; QoS &#xb7; retain preserved</tspan></text><text fill="#E2B66B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11"><tspan x="34" y="820.5">Prefixes are literal; include / separators deliberately</tspan></text></svg>