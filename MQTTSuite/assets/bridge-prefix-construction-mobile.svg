<svg width="620" height="1040" viewBox="0 0 620 1040" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="620" height="1040" rx="24" fill="#090E0D"/><text fill="#F1F7F4" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="bold"><tspan x="28" y="52.0909">Forwarded topic is literal concatenation</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="13"><tspan x="28" y="78.7273">bridge prefix + source-member prefix + destination-member prefix + original topic; </tspan><tspan x="28" y="94.7273">payload, QoS, and retain are preserved</tspan></text><circle cx="32" cy="980" r="4" fill="#56D697"/><text fill="#A6C7B8" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="46" y="986.5">Source-verified current behavior &#xb7; not separately runtime-exercised</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11"><tspan x="34" y="165.5">Source A receives</tspan></text><rect x="34.5" y="190.5" width="551" height="29" rx="8.5" fill="#10221A"/><rect x="34.5" y="190.5" width="551" height="29" rx="8.5" stroke="#203D31"/><text fill="#F1F7F4" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="271.769" y="206.5">a/temperature</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11"><tspan x="34" y="265.5">Concatenate in this exact order</tspan></text><rect x="34.5" y="290.5" width="551" height="29" rx="8.5" fill="#10221A"/><rect x="34.5" y="290.5" width="551" height="29" rx="8.5" stroke="#203D31"/><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspa