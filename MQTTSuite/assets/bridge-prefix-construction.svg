<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="800" rx="24" fill="#090E0D"/><text fill="#F1F7F4" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="bold"><tspan x="40" y="64.9091">Forwarded topic is literal concatenation</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="15"><tspan x="40" y="94.4545">bridge prefix + source-member prefix + destination-member prefix + original topic; payload, QoS, and retain are preserved</tspan></text><circle cx="44" cy="748" r="4" fill="#56D697"/><text fill="#A6C7B8" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600"><tspan x="58" y="755.864">Source-verified current behavior &#xb7; not separately runtime-exercised</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11"><tspan x="60" y="180.5">Source A receives</tspan></text><rect x="60.5" y="205.5" width="259" height="29" rx="8.5" fill="#10221A"/><rect x="60.5" y="205.5" width="259" height="29" rx="8.5" stroke="#203D31"/><text fill="#F1F7F4" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="151.769" y="221.5">a/temperature</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11"><tspan x="60" y="280.5">Topic construction</tspan></text><rect x="60.5" y="310.5" width="179" height="29" rx="8.5" fill="#10221A"/><rect x="60.5" y="310.5" width="179" height="29" rx="8.5" stroke="#203D31"/><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="130.675" y="326.5">bridge/</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16"><tspan x="248" y="331.318">+</tspan></text><rect x="275.5" y="310.5" width="179" height="29" rx="8.5" fill="#10221A"/><rect x="275.5" y="310.5" width="179" height="29" rx="8.5" stroke="#203D31"/><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="344.783" y="326.5">from-a/</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16"><tspan x="463" y="331.318">+</tspan></text><rect x="490.5" y="310.5" width="179" height="29" rx="8.5" fill="#10221A"/><rect x="490.5" y="310.5" width="179" height="29" rx="8.5" stroke="#203D31"/><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="566.486" y="326.5">to-b/</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16"><tspan x="678" y="331.318">+</tspan></text><rect x="705.5" y="310.5" width="249" height="29" rx="8.5" fill="#10221A"/><rect x="705.5" y="310.5" width="249" height="29" rx="8.5" stroke="#203D31"/><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="791.769" y="326.5">a/temperature</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="970" y="333.545">&#x2192;</tspan></text><rect x="995.6" y="270.6" width="153.8" height="118.8" rx="15.4" fill="#10221A"/><rect x="995.6" y="270.6" width="153.8" height="118.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="1013" y="304.545">Broker B</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="1013" y="325.864">bridge/from-a/</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="1013" y="345.864">to-b/a/temperature</tspan></text><rect x="360.5" y="420.5" width="429" height="29" rx="8.5" fill="#10221A"/><rect x="360.5" y="420.5" width="429" height="29" rx="8.5" stroke="#203D31"/><text fill="#A6C7B8" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="464.468" y="436.5">payload &#xb7; incoming QoS &#xb7; retain preserved</tspan></text><text fill="#E2B66B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11"><tspan x="60" y="530.5">Separators are not inserted automatically</tspan></text><rect x="60.6" y="555.6" width="493.8" height="103.8" rx="15.4" fill="#0B1713"/><rect x="60.6" y="555.6" width="493.8" height="103.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="78" y="589.545">Prefix values are literal</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="78" y="610.864">include / delimiters deliberately</tspan></text></svg>