13"/><rect x="320.6" y="605.6" width="264.8" height="123.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="338" y="639.545">mqtt</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="338" y="660.864">client id &#xb7; keep alive</tspan><tspan x="338" y="680.864">clean session &#xb7; will</tspan><tspan x="338" y="700.864">credentials</tspan></text><rect x="34.6" y="755.6" width="264.8" height="103.8" rx="15.4" fill="#0B1713"/><rect x="34.6" y="755.6" width="264.8" height="103.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="789.545">topics[]</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="810.864">filter &#xb7; subscription QoS</tspan></text><rect x="320.6" y="755.6" width="264.8" height="103.8" rx="15.4" fill="#0B1713"/><rect x="320.6" y="755.6" width="264.8" height="103.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="338" y="789.545">local state</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="338" y="810.864">prefix &#xb7; session_store</tspan></text><rect x="96.5" y="892.5" width="427" height="29" rx="8.5" fill="#10221A"/><rect x="96.5" y="892.5" width="427" height="29" rx="8.5" stroke="#203D31"/><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight=