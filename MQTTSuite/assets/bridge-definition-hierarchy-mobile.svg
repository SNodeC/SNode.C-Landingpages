<svg width="620" height="1180" viewBox="0 0 620 1180" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="620" height="1180" rx="24" fill="#090E0D"/><text fill="#F1F7F4" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="bold"><tspan x="28" y="52.0909">Bridge-definition hierarchy</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="13"><tspan x="28" y="78.7273">The JSON separates bridge-wide fields from per-broker network, MQTT session, </tspan><tspan x="28" y="94.7273">subscriptions, prefix, and session-store settings</tspan></text><circle cx="32" cy="1120" r="4" fill="#56D697"/><text fill="#A6C7B8" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="46" y="1126.5">Source-verified current behavior &#xb7; not separately runtime-exercised</tspan></text><rect x="34.6" y="155.6" width="550.8" height="83.8" rx="15.4" fill="#10221A"/><rect x="34.6" y="155.6" width="550.8" height="83.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="52" y="189.545">bridges[]</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="52" y="210.864">root collection</tspan></text><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="292" y="260.545">&#x2193;</tspan></text><rect x="34.6" y="280.6" width="550.8" height="108.8" rx="15.4" fill="#10221A"/><rect x="34.6" y="280.6" width="550.8" height="108.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, san