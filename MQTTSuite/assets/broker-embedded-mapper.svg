<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="800" rx="24" fill="#090E0D"/><text fill="#F1F7F4" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="bold"><tspan x="40" y="64.9091">Mapping can run inside MQTTBroker</tspan></text><text fill="#8CA59B" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="15"><tspan x="40" y="94.4545">Incoming publications follow normal broker routing and may also produce mapped publications that re-enter the same Broker</tspan></text><circle cx="44" cy="748" r="4" fill="#56D697"/><text fill="#A6C7B8" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600"><tspan x="58" y="755.864">Source-verified current behavior &#xb7; not separately runtime-exercised</tspan></text><rect x="55.6" y="280.6" width="238.8" height="108.8" rx="15.4" fill="#0B1713"/><rect x="55.6" y="280.6" width="238.8" height="108.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="73" y="314.545">Incoming PUBLISH</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="73" y="335.864">topic + payload + QoS + retain</tspan></text><rect x="295" y="335" width="125" height="2" rx="1" fill="#56D697"/><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="396" y="341.545">&#x2192;</tspan></text><rect x="420.6" y="225.6" width="308.8" height="208.8" rx="15.4" fill="#10221A"/><rect x="420.6" y="225.6" width="308.8" height="208.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="438" y="259.545">MQTTBroker</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="438" y="280.864">normal broker routing</tspan><tspan x="438" y="300.864">optional shared MqttMapper</tspan></text><rect x="730" y="285" width="115" height="2" rx="1" fill="#56D697"/><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="821" y="291.545">&#x2192;</tspan></text><rect x="845.6" y="230.6" width="288.8" height="108.8" rx="15.4" fill="#0B1713"/><rect x="845.6" y="230.6" width="288.8" height="108.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="863" y="264.545">Normal subscribers</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="863" y="285.864">original publication</tspan></text><rect x="730" y="365" width="90" height="2" rx="1" fill="#56D697"/><rect x="818" y="365" width="2" height="105" rx="1" fill="#56D697"/><rect x="818" y="468" width="120" height="2" rx="1" fill="#56D697"/><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="914" y="474.545">&#x2192;</tspan></text><rect x="938.6" y="410.6" width="195.8" height="113.8" rx="15.4" fill="#0B1713"/><rect x="938.6" y="410.6" width="195.8" height="113.8" rx="15.4" stroke="#203D31" stroke-width="1.2"/><text fill="#E7F0EB" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold"><tspan x="956" y="444.545">Mapped publish</tspan></text><text fill="#91AAA0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="12"><tspan x="956" y="465.864">immediate or delayed</tspan><tspan x="956" y="485.864">re-enters same Broker</tspan></text><rect x="430.5" y="470.5" width="284" height="29" rx="8.5" fill="#10221A"/><rect x="430.5" y="470.5" width="284" height="29" rx="8.5" stroke="#203D31"/><text fill="#56D697" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600"><tspan x="488.555" y="486.5">no child mqttintegrator process</tspan></text></svg>